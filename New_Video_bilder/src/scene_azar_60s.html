<html lang="ru">
<head>

<body>
<canvas id="master" width="1080" height="1920"></canvas>

<script type="module">
const W = 1080;
const H = 1920;
const DURATION = 60.0;
const BPM = 174.0;
const BEAT = 60.0 / BPM;
const PAD = 58;
const SAFE_W = W - PAD * 2; // 964px

const MIL = {
  bg: '#0b0f0a',
  panel: 'rgba(15, 21, 14, 0.93)',
  panelHi: 'rgba(23, 32, 20, 0.95)',
  panelCyan: 'rgba(12, 28, 30, 0.94)',
  sand: '#d5ae5c',
  sandHi: '#eed089',
  olive: '#849e54',
  phosphor: '#8fd158',
  cyan: '#3be2f0',
  cyanSoft: 'rgba(59, 226, 240, 0.22)',
  emerald: '#45e884',
  amber: '#f0a944',
  redRec: '#ef4c4c',
  bone: '#f3f0e6',
  ash: '#c8cbc0',
  muted: '#8d9685',
  borderSand: 'rgba(213, 174, 92, 0.52)',
  borderCyan: 'rgba(59, 226, 240, 0.48)',
};

// Exact frame-locked sync landmarks from src/azar_sync_map.json (Pendulum 174 BPM + voice-05)
const CUTS = [
  0.000000,   // S1 [0..323]     Приёмник «Азар» от 3mx
  5.383333,   // S2 [323..632]   Режим 1: Авто с «Булат» v.4 (300–8000 МГц)
  10.533333,  // S3 [632..1035]  Режим 2: Ручной 300–12 000 МГц + Радиотишина (174 BPM Drop @ ~13.0s)
  17.250000,  // S4 [1035..1528] Внешний монитор Jack 3.5 мм + Дальность до 1,5 км
  25.466667,  // S5 [1528..2083] Полевая надёжность: <=450 г · -20..+45°C · до 6,5 ч
  34.716667,  // S6 [2083..2627] Заводская коробка + Паспорт изделия 3mx
  43.783333,  // S7 [2627..3144] Поставка комплексов: оптом и в розницу, с НДС и без НДС
  52.400000,  // S8 [3144..3600] Финальный призыв: В ОКОПЕ — Telegram, VK, Авито + 2.35s DnB outro
  60.000000,
];

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const easeOutBack = (x) => {
  const c1 = 1.55, c3 = c1 + 1;
  const p = clamp(x, 0, 1) - 1;
  return 1 + c3 * p * p * p + c1 * p * p;
};
const smooth01 = (x) => {
  const c = clamp(x, 0, 1);
  return c * c * (3 - 2 * c);
};
const prog = (t, t0, dur) => clamp((t - t0) / Math.max(0.0001, dur), 0, 1);

function hash2(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return n - Math.floor(n);
}

const canvas = document.getElementById('master');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const ASSET_PATHS = {
  azarHero: '/assets/azar_3mx/azar_hero_full_rgba.png',
  azarFront: '/assets/azar_3mx/azar_front_closeup_rgba.png',
  azarBack: '/assets/azar_3mx/azar_back_full_rgba.png',
  azarKit: '/assets/azar_3mx/azar_kit_standing_rgba.png',
  azarBoxClose: '/assets/azar_3mx/azar_3_box_closeup.jpg',
  azarBoxWide: '/assets/azar_3mx/azar_4_box_wide.jpg',
  bulat4: '/assets/real_products/real_bulat4_rgba.png',
  logoFullSand: '/assets/brand/logo_full_sand.png',
  logoShieldSand: '/assets/brand/logo_shield_sand.png',
  bgRadar: '/assets/images/bg_radar_dusk.jpg',
  bgTrench: '/assets/images/bg_trench_dugout_dusk.jpg',
  bgArmor: '/assets/images/bg_armor_plate_camo.jpg',
  bgCrates: '/assets/images/bg_military_crates_olive.jpg',
};

const IMG = {};

async function loadAllAssets() {
  await document.fonts.ready;
  // Pre-warm every font weight/family used on canvas so glyph metrics are 100% deterministic from frame 0
  const warmCanvas = document.createElement('canvas');
  warmCanvas.width = 64;
  warmCanvas.height = 64;
  const wctx = warmCanvas.getContext('2d');
  for (const spec of [
    "900 48px 'RussoOne'",
    "400 48px 'RubikDirt'",
    "800 40px 'Tektur'",
    "600 32px 'Tektur'",
    "900 52px 'FiraCond'",
    "700 28px 'JetMono'",
    "500 24px 'JetMono'",
    "700 30px 'RobotoBold'",
  ]) {
    await document.fonts.load(spec, 'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ0123456789MHzГГц');
    wctx.font = spec;
    wctx.fillText('АЗАР 3mx БУЛАТ 12000 МГц В ОКОПЕ', 2, 32);
  }

  await Promise.all(
    Object.entries(ASSET_PATHS).map(async ([k, url]) => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.src = url;
      await im.decode();
      IMG[k] = im;
    })
  );
}

// Pre-baked subtle film grain tile for tactile broadcast finish (zero per-frame RNG cost)
const GRAIN_TILE = (() => {
  const g = document.createElement('canvas');
  g.width = 256;
  g.height = 256;
  const gc = g.getContext('2d');
  const id = gc.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) {
    const v = Math.floor(hash2(i % 256, (i / 256) | 0) * 255);
    id.data[i * 4] = v;
    id.data[i * 4 + 1] = v;
    id.data[i * 4 + 2] = v;
    id.data[i * 4 + 3] = 15;
  }
  gc.putImageData(id, 0, 0);
  return g;
})();

// Pre-rendered procedural aerial recon terrain canvas for Scene 4 simulated FPV monitor feed
const RECON_TERRAIN = (() => {
  const c = document.createElement('canvas');
  c.width = 960;
  c.height = 600;
  const g = c.getContext('2d');
  // Dusk sky-to-haze horizon
  const sky = g.createLinearGradient(0, 0, 0, 215);
  sky.addColorStop(0, '#4d5855');
  sky.addColorStop(0.65, '#7e8983');
  sky.addColorStop(1, '#a9b3ac');
  g.fillStyle = sky;
  g.fillRect(0, 0, 960, 215);

  // Ground perspective plain (215..600)
  const grd = g.createLinearGradient(0, 212, 0, 600);
  grd.addColorStop(0, '#5a635c');
  grd.addColorStop(0.35, '#3d453e');
  grd.addColorStop(1, '#222823');
  g.fillStyle = grd;
  g.fillRect(0, 212, 960, 388);

  // Field parcels & agricultural grid lines in perspective
  g.strokeStyle = 'rgba(175, 186, 176, 0.20)';
  g.lineWidth = 2;
  for (let k = -6; k <= 6; k++) {
    g.beginPath();
    g.moveTo(480 + k * 28, 214);
    g.lineTo(480 + k * 210, 600);
    g.stroke();
  }
  for (let r = 0; r < 11; r++) {
    const yy = 216 + Math.pow(r / 10, 1.85) * 380;
    g.strokeStyle = `rgba(165, 176, 166, ${(0.08 + r * 0.014).toFixed(3)})`;
    g.beginPath();
    g.moveTo(0, yy);
    g.lineTo(960, yy);
    g.stroke();
  }

  // Country road converging toward horizon center-right + dark treeline belt alongside
  g.fillStyle = '#8b948e';
  g.beginPath();
  g.moveTo(506, 214);
  g.lineTo(520, 214);
  g.lineTo(685, 600);
  g.lineTo(598, 600);
  g.closePath();
  g.fill();

  // Treeline belt & forest patches
  for (let i = 0; i < 190; i++) {
    const u = i / 189;
    const yy = 218 + Math.pow(u, 1.7) * 372;
    const xx = lerp(492, 560, Math.pow(u, 1.02)) - 14 - hash2(i, 7) * (12 + 34 * u);
    const rr = 3.5 + 16 * u * (0.65 + 0.5 * hash2(i, 19));
    g.fillStyle = `rgba(${18 + ((hash2(i, 3) * 18) | 0)}, ${24 + ((hash2(i, 5) * 20) | 0)}, ${19 + ((hash2(i, 9) * 16) | 0)}, 0.92)`;
    g.beginPath();
    g.arc(xx, yy, rr, 0, Math.PI * 2);
    g.fill();
  }
  // Distant treeline ridge on horizon
  for (let x = 0; x < 960; x += 6) {
    const hh = 5 + hash2(x, 41) * 13;
    g.fillStyle = 'rgba(34, 40, 35, 0.85)';
    g.fillRect(x, 214 - hh, 7, hh + 2);
  }
  // Small tracked vehicle / observation point silhouette on road shoulder at mid-distance
  g.fillStyle = '#d4dcd5';
  g.fillRect(548, 336, 22, 11);
  g.fillStyle = '#2a302b';
  g.fillRect(551, 339, 15, 5);
  return c;
})();

// Helper: auto-fit font size so string NEVER overflows maxW under any circumstance
function fitFont(text, maxW, weight, baseSize, family) {
  let sz = baseSize;
  ctx.font = `${weight} ${sz}px '${family}'`;
  let w = ctx.measureText(text).width;
  if (w > maxW && w > 0) {
    sz = Math.max(13, Math.floor(sz * (maxW / w) * 0.985));
    ctx.font = `${weight} ${sz}px '${family}'`;
  }
  return sz;
}

function drawFittedText(text, x, y, maxW, { weight = 800, size = 44, family = 'RussoOne', color = MIL.bone, align = 'left', baseline = 'alphabetic', shadow = true } = {}) {
  ctx.save();
  fitFont(text, maxW, weight, size, family);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  if (shadow) {
    ctx.shadowColor = 'rgba(0,0,0,0.72)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 3;
  }
  ctx.fillText(text, x, y);
  ctx.restore();
}

function roundRectPath(x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawTacticalCard(x, y, w, h, { fill = MIL.panel, stroke = MIL.borderSand, r = 16, accent = MIL.sand, glow = 0 } = {}) {
  ctx.save();
  if (glow > 0) {
    ctx.shadowColor = accent;
    ctx.shadowBlur = glow;
  }
  roundRectPath(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2;
  ctx.strokeStyle = stroke;
  ctx.stroke();

  // Crisp tactical corner brackets
  const L = Math.min(18, w * 0.08, h * 0.25);
  ctx.strokeStyle = accent;
  ctx.lineWidth = 3;
  for (const [cx, cy, sx, sy] of [
    [x + 1, y + 1, 1, 1],
    [x + w - 1, y + 1, -1, 1],
    [x + 1, y + h - 1, 1, -1],
    [x + w - 1, y + h - 1, -1, -1],
  ]) {
    ctx.beginPath();
    ctx.moveTo(cx + sx * L, cy);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx, cy + sy * L);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCoverImage(im, x, y, w, h, { zoom = 1.0, panX = 0, panY = 0, alpha = 1.0 } = {}) {
  const ir = im.width / im.height;
  const br = w / h;
  let dw, dh;
  if (ir > br) {
    dh = h * zoom;
    dw = dh * ir;
  } else {
    dw = w * zoom;
    dh = dw / ir;
  }
  const dx = x + (w - dw) * 0.5 + panX;
  const dy = y + (h - dh) * 0.5 + panY;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.drawImage(im, dx, dy, dw, dh);
  ctx.restore();
}

function drawContainImage(im, cx, cy, maxW, maxH, { scale = 1.0, alpha = 1.0, glowColor = null, glowBlur = 0, dropShadow = true } = {}) {
  const s = Math.min(maxW / im.width, maxH / im.height) * scale;
  const dw = im.width * s;
  const dh = im.height * s;
  const dx = cx - dw * 0.5;
  const dy = cy - dh * 0.5;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (glowColor && glowBlur > 0) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = glowBlur;
    ctx.drawImage(im, dx, dy, dw, dh);
  }
  if (dropShadow) {
    ctx.shadowColor = 'rgba(0, 0, 0, 0.78)';
    ctx.shadowBlur = 34;
    ctx.shadowOffsetY = 16;
  }
  ctx.drawImage(im, dx, dy, dw, dh);
  ctx.restore();
  return { x: dx, y: dy, w: dw, h: dh };
}

function drawSceneBackdrop(bgImg, t, scIdx, { tint = 'rgba(9, 14, 10, 0.76)', cyanRadial = 0.16, beatPulse = 0 } = {}) {
  const sStart = CUTS[scIdx];
  const sDur = CUTS[scIdx + 1] - sStart;
  const u = clamp((t - sStart) / sDur, 0, 1);

  ctx.fillStyle = MIL.bg;
  ctx.fillRect(0, 0, W, H);

  drawCoverImage(bgImg, 0, 0, W, H, {
    zoom: 1.06 + u * 0.055,
    panX: lerp(-16, 16, u) * (scIdx % 2 === 0 ? 1 : -1),
    panY: lerp(-10, 10, u),
    alpha: 0.44,
  });

  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, W, H);

  // Subtle tactical coordinate grid
  ctx.save();
  ctx.strokeStyle = 'rgba(132, 158, 84, 0.065)';
  ctx.lineWidth = 1;
  for (let gx = 60; gx < W; gx += 120) {
    ctx.beginPath();
    ctx.moveTo(gx, 0);
    ctx.lineTo(gx, H);
    ctx.stroke();
  }
  for (let gy = 80; gy < H; gy += 120) {
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();
  }
  ctx.restore();

  // Atmospheric dual glow (sand + 3mx cyan)
  const rg1 = ctx.createRadialGradient(W * 0.52, H * 0.48, 30, W * 0.52, H * 0.48, 760);
  rg1.addColorStop(0, `rgba(59, 226, 240, ${(cyanRadial + beatPulse * 0.07).toFixed(3)})`);
  rg1.addColorStop(0.55, 'rgba(34, 62, 48, 0.08)');
  rg1.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = rg1;
  ctx.fillRect(0, 0, W, H);

  // Vignette
  const vig = ctx.createRadialGradient(W * 0.5, H * 0.5, 420, W * 0.5, H * 0.5, 1140);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(4, 6, 4, 0.72)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function drawTopHUD(t, scIdx, sectionTag) {
  const y = 52;
  drawTacticalCard(PAD, y, SAFE_W, 92, {
    fill: 'rgba(14, 19, 12, 0.92)',
    stroke: 'rgba(213, 174, 92, 0.45)',
    r: 14,
    accent: MIL.sand,
  });

  // Official GOYDA shield logo on left
  drawContainImage(IMG.logoShieldSand, PAD + 48, y + 46, 66, 68, { dropShadow: false });

  drawFittedText('В ОКОПЕ · МАГАЗИН БРОНИ', PAD + 92, y + 40, 470, {
    weight: 900,
    size: 27,
    family: 'RussoOne',
    color: MIL.sandHi,
    shadow: false,
  });
  drawFittedText(sectionTag, PAD + 92, y + 71, 520, {
    weight: 700,
    size: 19,
    family: 'JetMono',
    color: MIL.cyan,
    shadow: false,
  });

  // Right status pill + scene counter 01/08 .. 08/08
  const pillW = 228;
  const px = PAD + SAFE_W - pillW - 18;
  roundRectPath(px, y + 20, pillW, 52, 10);
  ctx.fillStyle = 'rgba(59, 226, 240, 0.11)';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(59, 226, 240, 0.46)';
  ctx.stroke();

  const blink = 0.55 + 0.45 * Math.sin(t * 7.2);
  ctx.fillStyle = `rgba(69, 232, 132, ${blink.toFixed(3)})`;
  ctx.beginPath();
  ctx.arc(px + 22, y + 46, 6.5, 0, Math.PI * 2);
  ctx.fill();

  drawFittedText(`3mx АЗАР · 0${scIdx + 1}/08`, px + 38, y + 53, pillW - 48, {
    weight: 700,
    size: 20,
    family: 'JetMono',
    color: MIL.bone,
    shadow: false,
  });

  // Bottom progress bar along top HUD
  const totalU = clamp(t / DURATION, 0, 1);
  ctx.fillStyle = 'rgba(213, 174, 92, 0.20)';
  ctx.fillRect(PAD + 4, y + 88, SAFE_W - 8, 3);
  ctx.fillStyle = MIL.sand;
  ctx.fillRect(PAD + 4, y + 88, (SAFE_W - 8) * totalU, 3);
}

// =========================================================================
// SCENE 1 [0.000s .. 5.383s]: HERO REVEAL — «ВИДЕОПЕРЕХВАТ АЗАР ОТ 3mx»
// =========================================================================
function renderScene1(t, beatPulse) {
  const u = prog(t, CUTS[0], CUTS[1] - CUTS[0]);
  drawSceneBackdrop(IMG.bgRadar, t, 0, { cyanRadial: 0.22, beatPulse });
  drawTopHUD(t, 0, 'РАДИОЭЛЕКТРОННАЯ РАЗВЕДКА · НОВИНКА 3mx');

  // Kicker badge + Kinetic Headline
  const eHead = easeOutCubic(prog(t, 0.06, 0.46));
  ctx.save();
  ctx.globalAlpha = eHead;
  const slideY = (1 - eHead) * 34;

  roundRectPath(PAD, 174 + slideY, 430, 44, 8);
  ctx.fillStyle = 'rgba(59, 226, 240, 0.14)';
  ctx.fill();
  ctx.strokeStyle = MIL.borderCyan;
  ctx.lineWidth = 1.8;
  ctx.stroke();
  drawFittedText('● ВИДЕТЬ НЕБО ГЛАЗАМИ ДРОНА', PAD + 18, 203 + slideY, 396, {
    weight: 800,
    size: 21,
    family: 'JetMono',
    color: MIL.cyan,
    shadow: false,
  });

  drawFittedText('ПРИЁМНИК «АЗАР»', PAD, 286 + slideY, SAFE_W, {
    weight: 900,
    size: 74,
    family: 'RussoOne',
    color: MIL.bone,
  });
  drawFittedText('АНАЛОГОВЫЙ ВИДЕОПЕРЕХВАТ FPV · 3mx', PAD, 340 + slideY, SAFE_W, {
    weight: 800,
    size: 33,
    family: 'Tektur',
    color: MIL.sandHi,
  });
  ctx.restore();

  // Concentric RF radar rings behind the full-antenna Azar hero
  const cx = 560, cy = 1090;
  ctx.save();
  for (let rIdx = 0; rIdx < 4; rIdx++) {
    const rad = 165 + rIdx * 118 + ((t * 58) % 118) * 0.35;
    ctx.strokeStyle = `rgba(59, 226, 240, ${(0.24 - rIdx * 0.048).toFixed(3)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy - 30, rad, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Rotating radar sweep sector
  const ang = t * 1.85;
  const sweepGrad = ctx.createRadialGradient(cx, cy - 30, 20, cx, cy - 30, 520);
  sweepGrad.addColorStop(0, 'rgba(59, 226, 240, 0.20)');
  sweepGrad.addColorStop(1, 'rgba(59, 226, 240, 0)');
  ctx.fillStyle = sweepGrad;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 30);
  ctx.arc(cx, cy - 30, 520, ang, ang + 0.62);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Subtle companion rear-angle silhouette on right-back + Main Full-Antenna Front Hero front-center-right
  const eProd = easeOutBack(prog(t, 0.14, 0.62));
  drawContainImage(IMG.azarBack, 790, 1085, 290, 1020, {
    scale: 0.94 + 0.06 * eProd,
    alpha: 0.86 * clamp(eProd, 0, 1),
    glowColor: 'rgba(213, 174, 92, 0.25)',
    glowBlur: 24,
  });
  drawContainImage(IMG.azarHero, 505, 1035 + Math.sin(t * 2.1) * 5, 470, 1280, {
    scale: 0.90 + 0.10 * eProd,
    alpha: clamp(eProd * 1.15, 0, 1),
    glowColor: 'rgba(59, 226, 240, 0.42)',
    glowBlur: 34 + beatPulse * 14,
  });

  // Left floating telemetry callout cards pointing right at antennas & glowing 3mx LCD
  const callouts = [
    { t0: 0.65, y: 495, label: '2 АНТЕННЫ SMA (M)', val: 'ГИБКАЯ ПРУЖИНА', col: MIL.sandHi },
    { t0: 1.25, y: 745, label: 'ДИСПЛЕЙ 3mx', val: 'МГНОВЕННЫЙ СИГНАЛ', col: MIL.cyan },

  // Top live FFT spectrum trace box (wy .. wy + 145)
  const fftH = 142;

    size: 23,

  ctx.strokeStyle = 'rgba(242, 246, 240, 0.82)';
  ctx.lineWidth = 2.4;

  ctx.beginPath();

// =========================================================================
// STATELESS MASTER FRAME DISPATCHER (100% BIT-EXACT DETERMINISTIC)
// =========================================================================
function renderFrame(rawTime) {
  const t = clamp(rawTime, 0, DURATION - 1e-4);

  // Beat pulse locked to 174 BPM Pendulum clock
  const beatPhase = (t / BEAT) % 1;
  const beatPulse = Math.exp(-beatPhase * 5.2);

  let scIdx = 0;
  for (let i = 0; i < 8; i++) {
    if (t >= CUTS[i] && t < CUTS[i + 1]) {
      scIdx = i;
      break;
    }
  }
  if (t >= CUTS[8] - 1e-3) scIdx = 7;

  switch (scIdx) {
    case 0: renderScene1(t, beatPulse); break;
    case 1: renderScene2(t, beatPulse); break;
    case 2: renderScene3(t, beatPulse); break;
    case 3: renderScene4(t, beatPulse); break;
    case 4: renderScene5(t, beatPulse); break;
    case 5: renderScene6(t, beatPulse); break;
    case 6: renderScene7(t, beatPulse); break;
    default: renderScene8(t, beatPulse); break;
  }

  // Crisp subtle tactical shutter flash right across cut boundaries (first 0.14s of scenes 2..8)
  if (scIdx > 0) {
    const dtCut = t - CUTS[scIdx];
    if (dtCut >= 0 && dtCut < 0.14) {
      const fa = (1 - dtCut / 0.14) * 0.22;
      ctx.fillStyle = `rgba(213, 232, 224, ${fa.toFixed(4)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // Deterministic film grain pass across entire 1080×1920 frame
  const ox = ((Math.floor(t * 60) * 37) % 128);
  const oy = ((Math.floor(t * 60) * 53) % 128);
  for (let gx = -ox; gx < W; gx += 256) {
    for (let gy = -oy; gy < H; gy += 256) {
      ctx.drawImage(GRAIN_TILE, gx, gy);
    }
  }
}

window.renderAt = renderFrame;
window.getFrameSignature = function () {
  const d = ctx.getImageData(0, 0, W, H).data;
  let h = 2166136261;
  for (let i = 0; i < d.length; i += 97) {
    h ^= d[i];
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
};

window.__READY_PROMISE = loadAllAssets().then(() => {
  renderFrame(0);
  return true;
});
