const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a || 1e-6), 0, 1);
const smoothstep = (e0, e1, x) => { const t = invLerp(e0, e1, x); return t * t * (3 - 2 * t); };
const easeOutExpo = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const easeOutBack = (x, s = 1.25) => { const t = clamp(x, 0, 1) - 1; return t * t * ((s + 1) * t + s) + 1; };
const hash11 = (p) => { const s = Math.sin(p * 127.1 + 311.7) * 43758.5453123; return s - Math.floor(s); };
const vnoise = (x) => { const i = Math.floor(x), f = x - i; return lerp(hash11(i), hash11(i + 1), f * f * (3 - 2 * f)); };

const FONT_CACHE = new Map();
function setFittedFont(g, text, maxW, maxPx, minPx, family, weight = '900') {
  const key = `${weight}|${family}|${maxPx}|${minPx}|${maxW | 0}|${text}`;
  const cached = FONT_CACHE.get(key);
  if (cached) { g.font = cached; return parseInt(cached.split(' ')[1], 10); }
  let size = maxPx;
  while (size > minPx) {
    g.font = `${weight} ${size}px ${family}`;
    if (g.measureText(text).width <= maxW) break;
    size -= 2;
  }
  const res = `${weight} ${size}px ${family}`;
  FONT_CACHE.set(key, res);
  g.font = res;
  return size;
}

function armorPlatePath(g, x, y, w, h, cut = 22) {
  const c = Math.min(cut, w * 0.25, h * 0.35);
  g.beginPath();
  g.moveTo(x + c, y); g.lineTo(x + w - c, y); g.lineTo(x + w, y + c); g.lineTo(x + w, y + h - c);
  g.lineTo(x + w - c, y + h); g.lineTo(x + c, y + h); g.lineTo(x, y + h - c); g.lineTo(x, y + c);
  g.closePath();
}

function drawArmorPlate(g, x, y, w, h, opts = {}) {
  const { cut = 22, fill = MIL.plateFill, stroke = MIL.borderSand, lineW = 2.0, rivets = true, hazardTopRight = false, accentBarLeft = null } = opts;
  g.save();
  armorPlatePath(g, x, y, w, h, cut);
  g.fillStyle = fill; g.fill();
  g.lineWidth = lineW; g.strokeStyle = stroke; g.stroke();
  if (accentBarLeft) {
    g.fillStyle = accentBarLeft;
    g.fillRect(x + 2, y + cut + 6, 6, Math.max(8, h - (cut + 6) * 2));
  }
  if (hazardTopRight) {
    g.save(); armorPlatePath(g, x, y, w, h, cut); g.clip();
    g.fillStyle = 'rgba(213, 174, 92, 0.16)';
    for (let i = 0; i < 6; i++) {
      const sx = x + w - 165 + i * 26;
      g.beginPath(); g.moveTo(sx, y); g.lineTo(sx + 13, y); g.lineTo(sx - 15, y + 36); g.lineTo(sx - 28, y + 36); g.closePath(); g.fill();
    }
    g.restore();
  }
  if (rivets) {
    const off = Math.max(14, cut * 0.68);
    g.fillStyle = 'rgba(213, 174, 92, 0.45)';
    for (const [rx, ry] of [[x + off, y + off], [x + w - off, y + off], [x + off, y + h - off], [x + w - off, y + h - off]]) {
      g.beginPath(); g.arc(rx, ry, 3.2, 0, Math.PI * 2); g.fill();
    }
  }
  g.restore();
}

function makeCamera3D(pos, target, fovDeg = 46, roll = 0) {
  let fx = target[0] - pos[0], fy = target[1] - pos[1], fz = target[2] - pos[2];
  const fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
  let rx = -fz, ry = 0, rz = fx; const rl = Math.hypot(rx, ry, rz) || 1; rx /= rl; rz /= rl;
  let ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
  if (roll !== 0) {
    const cr = Math.cos(roll), sr = Math.sin(roll);
    const nrx = rx * cr + ux * sr, nry = ry * cr + uy * sr, nrz = rz * cr + uz * sr;
    ux = ux * cr - rx * sr; uy = uy * cr - ry * sr; uz = uz * cr - rz * sr;
    rx = nrx; ry = nry; rz = nrz;
  }
  return { pos, fx, fy, fz, rx, ry, rz, ux, uy, uz, focal: (H * 0.5) / Math.tan((fovDeg * Math.PI) / 360) };
}

function project3D(cam, x, y, z) {
  const dx = x - cam.pos[0], dy = y - cam.pos[1], dz = z - cam.pos[2];
  const cz = dx * cam.fx + dy * cam.fy + dz * cam.fz;
  if (cz <= 0.15) return null;
  const s = cam.focal / cz;
  return { x: W * 0.5 + (dx * cam.rx + dy * cam.ry + dz * cam.rz) * s, y: H * 0.5 - (dx * cam.ux + dy * cam.uy + dz * cam.uz) * s, z: cz };
}

const EMBER_PTS = Array.from({ length: 120 }, (_, i) => ({
  x: (hash11(i * 3.1) - 0.5) * 18,
  y: (hash11(i * 7.7) - 0.35) * 14,
  z: -hash11(i * 11.3) * 24 + 4,
  r: 1.3 + hash11(i * 5.9) * 2.4,
  warm: hash11(i * 2.3) > 0.44,
}));

function draw3DTacticalField(g, cam, accentHex, domeRot, showDome = true) {
  g.save();
  g.lineWidth = 1.2;
  for (let gx = -12; gx <= 12; gx += 2.0) {
    g.strokeStyle = gx === 0 ? 'rgba(213, 174, 92, 0.32)' : 'rgba(98, 120, 62, 0.20)';
    const a = project3D(cam, gx, -2.4, 6), b = project3D(cam, gx, -2.4, -22);
    if (a && b) { g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
  }
  if (showDome) {
    for (let ri = 0; ri < 2; ri++) {
      const rad = 3.05 + ri * 0.38;
      const tiltX = 1.18 + Math.sin(domeRot * 1.5 + ri) * 0.22;
      const spinY = domeRot * (ri ? -1.3 : 1.15) + ri;
      g.strokeStyle = ri === 0 ? 'rgba(213, 174, 92, 0.34)' : 'rgba(143, 209, 88, 0.30)';
      g.lineWidth = 1.8;
      g.beginPath();
      let started = false;
      for (let s = 0; s <= 32; s++) {
        const ang = (s / 32) * Math.PI * 2;
        const lx = Math.cos(ang) * rad, ly = Math.sin(ang) * rad * Math.cos(tiltX), lz = Math.sin(ang) * rad * Math.sin(tiltX);
        const p = project3D(cam, lx * Math.cos(spinY) - lz * Math.sin(spinY), 0.15 + ly, lx * Math.sin(spinY) + lz * Math.cos(spinY));
        if (p) { if (!started) { g.moveTo(p.x, p.y); started = true; } else g.lineTo(p.x, p.y); }
      }
      g.stroke();
    }
  }
  const cr = Math.cos(domeRot * 0.22), sr = Math.sin(domeRot * 0.22);
  for (let i = 0; i < EMBER_PTS.length; i++) {
    const d = EMBER_PTS[i];
    const p = project3D(cam, d.x * cr - d.z * sr, d.y, d.x * sr + d.z * cr);
    if (!p || p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) continue;
    const df = clamp(1.35 - p.z / 22, 0.08, 1);
    g.fillStyle = d.warm ? `rgba(218,168,82,${(0.54 * df).toFixed(2)})` : `rgba(143,209,88,${(0.44 * df).toFixed(2)})`;
    g.beginPath(); g.arc(p.x, p.y, clamp(d.r * (7.5 / p.z), 0.8, 4.6), 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

  g.save();

  const c = SYNC.cuts;
  if (tc < c[1]) return 0;
  if (tc < c[2]) return 1;
  if (tc < c[3]) return 2;
  if (tc < c[4]) return 3;
  return 4;
}

window.renderAt = function renderAt(t) {
  const tc = clamp(t, 0, DURATION);
  const sIdx = getSceneIndex(tc);
  mctx.globalAlpha = 1; mctx.globalCompositeOperation = 'source-over';
  mctx.textBaseline = 'alphabetic'; mctx.textAlign = 'left';

  if (sIdx === 0) renderScene1(mctx, tc);
  else if (sIdx === 1) renderScene2(mctx, tc);
  else if (sIdx === 2) renderScene3(mctx, tc);
  else if (sIdx === 3) renderScene4(mctx, tc);
  else renderScene5(mctx, tc);

  for (let i = 1; i <= 4; i++) {
    const dt = tc - SYNC.cuts[i];
    if (Math.abs(dt) < 0.09) {
      const k = 1 - Math.abs(dt) / 0.09;
      const wipeX = lerp(-W * 0.3, W * 1.3, invLerp(-0.09, 0.09, dt));
      const lg = mctx.createLinearGradient(wipeX - 240, 0, wipeX + 240, 0);
      lg.addColorStop(0, 'rgba(213,174,92,0)');
      lg.addColorStop(0.5, `rgba(232,192,104,${(0.38 * k).toFixed(2)})`);
      lg.addColorStop(1, 'rgba(132,158,84,0)');
      mctx.fillStyle = lg; mctx.fillRect(0, 0, W, H);
    }
  }

  // Fast blitted HUD + live beat pulse LED + progress bar
  mctx.drawImage(BAKED_HUD[sIdx], 0, 0);
  const beat = 60.0 / SYNC.bpm;
  const pulse = 0.5 + 0.5 * Math.sin((tc * Math.PI * 2) / beat);
  mctx.beginPath(); mctx.arc(SAFE_PAD + SAFE_W - 36, 112, 6.5, 0, Math.PI * 2);
  mctx.fillStyle = `rgba(143, 209, 88, ${(0.55 + 0.45 * pulse).toFixed(2)})`; mctx.fill();

  mctx.fillStyle = 'rgba(213, 174, 92, 0.16)'; mctx.fillRect(SAFE_PAD, 1840, SAFE_W, 7);
  mctx.fillStyle = CFG.accent; mctx.fillRect(SAFE_PAD, 1840, Math.max(8, SAFE_W * (tc / DURATION)), 7);
};

window.setBrand = function setBrand(slug, syncObj) {
  CFG = BRAND_DB[slug];
  SYNC = syncObj;
  FONT_CACHE.clear();
  const sectors = [
    CFG.hudSector,
    `${CFG.hudSector.split('//')[0].trim()} // МОДЕЛИ`,
    `${CFG.hudSector.split('//')[0].trim()} // ХАРАКТЕРИСТИКИ`,
    'ПОСТАВКА // ОПТ, РОЗНИЦА И НДС',
    'ЗАКАЗ // ТЕЛЕГРАМ · ВК · АВИТО',
  ];
  BAKED_HUD.length = 0;
  for (const s of sectors) BAKED_HUD.push(buildBakedHudBar(s, CFG.accent));
  window.renderAt(0);
};

window.getFrameSignature = function getFrameSignature() {
  const data = mctx.getImageData(0, 0, W, H).data;
  let h1 = 0x811c9dc5;
  for (let i = 0; i < data.length; i += 64) { h1 ^= data[i]; h1 = Math.imul(h1, 0x01000193) >>> 0; }
  return h1.toString(16).padStart(8, '0');
};

window.__READY_PROMISE = (async () => {
  const syncMap = await fetch('/src/lineups_sync_map.json').then((r) => r.json());
  await Promise.all(
    ['900 48px RussoOne', '400 32px RubikDirt', '800 28px Tektur', '900 40px FiraCond', '800 24px JetMono', '700 24px RobotoBold'].map((sp) =>
      document.fonts.load(sp, 'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюяABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789✓[]·/-•+')
    )
  );
  await document.fonts.ready;

  await Promise.all(
    Object.entries(ASSET_PATHS).map(
      ([k, url]) => new Promise((res, rej) => { const im = new Image(); im.onload = () => { IMGS[k] = im; res(); }; im.onerror = rej; im.src = url; })
    )
  );

  BAKED_BG.s1 = buildBakedBg(IMGS.bgDugout, 0.46, true);
  BAKED_BG.s2 = buildBakedBg(IMGS.bgArmor, 0.66, false);
  BAKED_BG.s3 = buildBakedBg(IMGS.bgCrates, 0.72, false);
  BAKED_BG.s4 = buildBakedBg(IMGS.bgCrates, 0.52, false);

  window.setBrand(BRAND_SLUG, syncMap[BRAND_SLUG]);
  window.__SCENE_READY = true;
  return true;
})();
