const COL = {

// Exact contiguous 7-chapter broadcast timeline synced to detectors_longform_master.wav (374.00s)
const CHAPTERS = [

  { idx: 4, code: "02:29", start: 149.870, end: 205.810, short: "04 · ТЕНЬ · АМУЛЕТ · H233",title: "СПЕЦЗАДАЧИ, РЕЙДОВЫЙ КЕЙС И СЕТЕВОЙ ЩИТ ПЕРИМЕТРА" },

const ASSET_PATHS = {

const IMG = {};
let bgStaticCanvas = null;
let glowGold = null, glowGreen = null, glowRed = null;

function makeGlowSprite(rgbStr, size = 512) {
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0.0, `rgba(${rgbStr}, 0.42)`);
  grad.addColorStop(0.45, `rgba(${rgbStr}, 0.14)`);
  grad.addColorStop(1.0, `rgba(${rgbStr}, 0.0)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  return c;
}

function buildStaticBackdrop() {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#060a07";
  g.fillRect(0, 0, W, H);
  if (IMG.bgRadar) {
    g.save();
    g.globalAlpha = 0.20;
    const sc = Math.max(W / IMG.bgRadar.width, H / IMG.bgRadar.height);
    const dw = IMG.bgRadar.width * sc, dh = IMG.bgRadar.height * sc;
    g.drawImage(IMG.bgRadar, (W - dw) / 2, (H - dh) / 2, dw, dh);
    g.restore();
  }
  const vig = g.createRadialGradient(W * 0.52, H * 0.48, 220, W * 0.5, H * 0.5, 1180);
  vig.addColorStop(0, "rgba(10, 20, 14, 0.25)");
  vig.addColorStop(1, "rgba(4, 7, 5, 0.92)");
  g.fillStyle = vig;
  g.fillRect(0, 0, W, H);

  // Crisp subtle tactical telemetry grid
  g.strokeStyle = "rgba(120, 175, 138, 0.055)";
  g.lineWidth = 1;
  for (let x = 0; x <= W; x += 64) {
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
  }
  for (let y = 0; y <= H; y += 64) {
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  return c;
}

window.__READY_PROMISE = (async () => {
  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }
  await Promise.all(
    Object.entries(ASSET_PATHS).map(([k, url]) => new Promise((resolve) => {
      const im = new Image();
      im.onload = () => { IMG[k] = im; resolve(); };
      im.onerror = () => { console.warn("Missing asset:", url); resolve(); };
      im.src = url;
    }))
  );
  glowGold  = makeGlowSprite("224, 184, 97", 560);
  glowGreen = makeGlowSprite("86, 230, 138", 560);
  glowRed   = makeGlowSprite("255, 92, 92", 520);
  bgStaticCanvas = buildStaticBackdrop();
  window.renderAt(0.0);
  return true;
})();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutCubic = (x) => { const c = clamp(x, 0, 1); return 1 - Math.pow(1 - c, 3); };
const easeInOut = (x) => { const c = clamp(x, 0, 1); return c < 0.5 ? 4*c*c*c : 1 - Math.pow(-2*c + 2, 3)/2; };

function roundRect(x, y, w, h, r = 14) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawCard(x, y, w, h, opts = {}) {
  const { accent = COL.gold, bg = COL.bgCard, radius = 16, highlight = false } = opts;
  roundRect(x, y, w, h, radius);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.lineWidth = highlight ? 2.2 : 1.3;
  ctx.strokeStyle = highlight ? accent : "rgba(224,184,97,0.28)";
  ctx.stroke();

  // Top tactical corner brackets
  const L = 16;
  ctx.strokeStyle = accent;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(x + 2, y + L); ctx.lineTo(x + 2, y + 2); ctx.lineTo(x + L, y + 2);
  ctx.moveTo(x + w - L, y + 2); ctx.lineTo(x + w - 2, y + 2); ctx.lineTo(x + w - 2, y + L);
  ctx.stroke();
}

function drawBadge(text, x, y, bg, fg, fontSize = 15) {
  ctx.font = `700 ${fontSize}px "JetBrainsMono", monospace`;
  const padX = 14, h = fontSize + 14;
  const w = Math.ceil(ctx.measureText(text).width + padX * 2);
  roundRect(x, y, w, h, 8);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = fg;
  ctx.lineWidth = 1.1;
  ctx.stroke();
  ctx.fillStyle = fg;
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillText(text, x + padX, y + h / 2 + 1);
  return w;
}

function drawCutout(key, cx, cy, maxW, maxH, t, phase = 0, glow = glowGold, scaleMul = 1.0) {
  const im = IMG[key];
  if (!im) return;
  const floatY = Math.sin(t * 1.65 + phase) * 5.5;
  const pulse = 1.0 + 0.012 * Math.sin(t * 3.1 + phase);
  const sc = Math.min(maxW / im.width, maxH / im.height) * scaleMul * pulse;
  const dw = im.width * sc, dh = im.height * sc;
  if (glow) {
    const gs = Math.max(dw, dh) * 1.25;
    ctx.drawImage(glow, cx - gs / 2, cy + floatY - gs / 2, gs, gs);
  }
  // Ground contact shadow ellipse
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.48)";
  ctx.beginPath();
  ctx.ellipse(cx, cy + maxH * 0.46, Math.min(dw * 0.42, 160), 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.drawImage(im, cx - dw / 2, cy + floatY - dh / 2, dw, dh);
  ctx.restore();
}

function wrapLines(text, maxWidth, font) {
  ctx.font = font;
  const words = text.split(" ");
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawBullets(items, x, y, maxW, lineGap = 12, accent = COL.green, fontSize = 20) {
  let cy = y;
  const font = `700 ${fontSize}px "Montserrat", sans-serif`;
  for (const item of items) {
    ctx.fillStyle = accent;
    roundRect(x, cy + 6, 9, 9, 3);
    ctx.fill();
    const lines = wrapLines(item, maxW - 24, font);
    ctx.font = font;
    ctx.fillStyle = COL.text;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    for (const ln of lines) {
      ctx.fillText(ln, x + 22, cy);
      cy += fontSize + 7;
    }
    cy += lineGap;
  }
  return cy;
}

function drawSpecGrid(specs, x, y, w, cols = 2) {
  const gap = 14;
  const cw = (w - gap * (cols - 1)) / cols;
  const rh = 78;
  specs.forEach((sp, i) => {
    const r = Math.floor(i / cols), c = i % cols;
    const bx = x + c * (cw + gap), by = y + r * (rh + gap);
    roundRect(bx, by, cw, rh, 12);
    ctx.fillStyle = "rgba(255,255,255,0.045)";
    ctx.fill();
    ctx.strokeStyle = "rgba(224,184,97,0.24)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.font = `700 13px "JetBrainsMono", monospace`;
    ctx.fillStyle = COL.muted;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText(sp[0], bx + 16, by + 12);

    ctx.font = `800 22px "RussoOne", sans-serif`;
    ctx.fillStyle = sp[2] || COL.goldBright;
    ctx.fillText(sp[1], bx + 16, by + 37);
  });
}

function drawTopAndBottomChrome(t, chIdx) {
  // Top bar y = 20..82
  roundRect(42, 20, W - 84, 62, 14);
  ctx.fillStyle = "rgba(10, 16, 12, 0.90)";
  ctx.fill();
  ctx.strokeStyle = "rgba(224, 184, 97, 0.32)";
  ctx.lineWidth = 1.2;
  ctx.stroke();

  if (IMG.logoShield) {
    ctx.drawImage(IMG.logoShield, 58, 25, 48, 52);
  }
  ctx.font = `400 22px "RussoOne", sans-serif`;
  ctx.fillStyle = COL.goldBright;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText("В ОКОПЕ", 118, 43);

  ctx.font = `700 12px "JetBrainsMono", monospace`;
  ctx.fillStyle = COL.green;
  ctx.fillText("РАДИОРАЗВЕДКА · 19 ПОЗИЦИЙ", 118, 64);

  // 7 interactive chapter pills across top bar right
  let px = 376;
  const availW = 1486;
  const pillGap = 8;
  const pillW = (availW - pillGap * (CHAPTERS.length - 1)) / CHAPTERS.length;
  CHAPTERS.forEach((c, idx) => {
    const active = idx === chIdx;
    const done = idx < chIdx;
    roundRect(px, 30, pillW, 42, 9);
    ctx.fillStyle = active ? "rgba(224, 184, 97, 0.22)" : (done ? "rgba(86, 230, 138, 0.10)" : "rgba(255,255,255,0.035)");
    ctx.fill();
    ctx.strokeStyle = active ? COL.goldBright : (done ? "rgba(86,230,138,0.4)" : "rgba(255,255,255,0.09)");
    ctx.lineWidth = active ? 1.8 : 1;
    ctx.stroke();

    if (active) {
      const prog = clamp((t - c.start) / (c.end - c.start), 0, 1);
      roundRect(px + 2, 66, Math.max(6, (pillW - 4) * prog), 4, 2);
      ctx.fillStyle = COL.goldBright;
      ctx.fill();
    }

    ctx.font = `700 12px "JetBrainsMono", monospace`;
    ctx.fillStyle = active ? COL.goldBright : (done ? COL.green : COL.muted);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(c.short, px + pillW / 2, 49);
    px += pillW + pillGap;
  });

  // Bottom RF spectrum strip y = 1004..1060
  roundRect(42, 1004, W - 84, 56, 12);
  ctx.fillStyle = "rgba(10, 16, 12, 0.90)";
  ctx.fill();
  ctx.strokeStyle = "rgba(224,184,97,0.26)";
  ctx.lineWidth = 1;
  ctx.stroke();

  // Animated 56-bin live spectrum analyzer on left-center
  const sx0 = 62, nb = 56, bw = 8, bgap = 3;
  const beatKick = Math.pow(Math.max(0, Math.sin(t * Math.PI / BPM_BEAT)), 4);
  for (let i = 0; i < nb; i++) {
    const f = i / nb;
    const wave = 0.35 + 0.35 * Math.sin(t * 4.4 + i * 0.42) + 0.30 * Math.cos(t * 7.1 - i * 0.27);
    const spike = (Math.abs(f - ((t * 0.14) % 1.0)) < 0.06) ? 0.45 : 0.0;
    const h = clamp((wave + spike + beatKick * 0.18) * 34, 4, 38);
    ctx.fillStyle = h > 28 ? COL.goldBright : COL.green;
    ctx.fillRect(sx0 + i * (bw + bgap), 1050 - h, bw, h);
  }

  ctx.font = `700 14px "JetBrainsMono", monospace`;
  ctx.fillStyle = COL.muted;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText("100 МГц ── 1.2 ГГц ── 2.4 ГГц ── 3.3 ГГц ── 5.8 ГГц ── 7.2 ГГц ── 13 ГГц  │  ПАССИВНЫЙ РЕЖИМ 0.00 Вт", 705, 1032);

  // Overall master timeline progress bar
  const totalProg = clamp(t / DURATION, 0, 1);
  ctx.fillStyle = COL.goldBright;
  ctx.textAlign = "right";
  const curM = String(Math.floor(t / 60)).padStart(2, "0");
  const curS = String(Math.floor(t % 60)).padStart(2, "0");
  ctx.fillText(`${curM}:${curS} / 06:14`, W - 62, 1032);
  ctx.fillStyle = "rgba(224,184,97,0.85)";
  ctx.fillRect(56, 1057, (W - 112) * totalProg, 2.5);
}

function drawHeaderTitle(kicker, title, subtitle, enterP = 1) {
  const dy = (1 - easeOutCubic(enterP)) * 18;
  ctx.save();
  ctx.globalAlpha = clamp(enterP * 1.4, 0, 1);
  drawBadge(kicker, 56, 102 + dy, COL.amberDim, COL.goldBright, 15);
  ctx.font = `400 44px "RussoOne", sans-serif`;
  ctx.fillStyle = COL.text;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText(title, 56, 144 + dy);
  if (subtitle) {
    ctx.font = `700 20px "Montserrat", sans-serif`;
    ctx.fillStyle = COL.muted;
    ctx.fillText(subtitle, 56, 200 + dy);
  }
  ctx.restore();
}

    // Lower-left: Passive RF Advantage Card

    drawBadge("ПАССИВНЫЙ ДЕТЕКТОР · 0.00 Вт В ЭФИР", 84, 638, COL.greenDim, COL.green, 15);

    drawBullets([

window.renderAt = function(tSec) {
  const t = clamp(Number(tSec) || 0, 0, DURATION);
  ctx.drawImage(bgStaticCanvas, 0, 0);

  let chIdx = 0;
  for (let i = 0; i < CHAPTERS.length; i++) {
    if (t >= CHAPTERS[i].start && (t < CHAPTERS[i].end || i === CHAPTERS.length - 1)) {
      chIdx = i;
      break;
    }
  }
  let beat = BEATS[0];
  for (let i = 0; i < BEATS.length; i++) {
    if (t >= BEATS[i].start && (t < BEATS[i].end || i === BEATS.length - 1)) {
      beat = BEATS[i];
      break;
    }
  }
  const beatDur = Math.max(0.001, beat.end - beat.start);
  const localT = t - beat.start;
  const enterP = clamp(localT / 0.42, 0, 1);

  renderBeat(beat, t, localT / beatDur, enterP);

  // Subtle clean flash-wipe right on beat transitions
  if (localT < 0.22 && beat.start > 0.01) {
    ctx.fillStyle = `rgba(224, 184, 97, ${(1 - localT / 0.22) * 0.14})`;
    ctx.fillRect(0, 0, W, H);
  }

  drawTopAndBottomChrome(t, chIdx);
};

window.getFrameSignature = function() {
  const d = ctx.getImageData(0, 0, W, H).data;
  let h = 2166136261 >>> 0;
  for (let i = 0; i < d.length; i += 64) {
    h ^= d[i];
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h.toString(16);
};
