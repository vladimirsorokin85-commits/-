<script type="module">
const W = 1080;
const H = 1920;
const DURATION = 30.0;
const BPM = 175.0;
const BEAT = 60.0 / BPM;
const SAFE_PAD = 60;
const SAFE_W = W - SAFE_PAD * 2; // 960px

const MIL = {
  bgDark: '#0c1009',
  plateFill: 'rgba(18, 23, 14, 0.94)',
  plateFill2: 'rgba(25, 32, 19, 0.95)',
  oliveActive: 'rgba(54, 71, 35, 0.95)',
  sand: '#d5ae5c',
  sandBright: '#e7c475',
  olive: '#849e54',
  phosphor: '#8fd158',
  cyanVolt: '#62d8b4',
  bone: '#f2efe4',
  ash: '#c5c7ba',
  muted: '#8f9683',
  borderSand: 'rgba(213, 174, 92, 0.52)',
  borderOlive: 'rgba(132, 158, 84, 0.48)',
};

// Exact measured audio sync landmarks from src/power_sync_map.json
const SYNC = {
  cuts: [0.0, 4.966667, 11.133333, 17.85, 23.516667, 30.0],
  s1Lock: 0.4565,
  s1Drop: 1.3714,
  s2Nodes: [4.9667, 6.48, 8.02, 9.56],
  s3Rows: [12.1408, 13.6185, 15.0962, 16.5067],
  s4Drop: 17.9065,
  s5Slam: 23.6919,
  s5Sting: 27.4286,
};

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a || 1e-6), 0, 1);
const smoothstep = (e0, e1, x) => {
  const t = invLerp(e0, e1, x);
  return t * t * (3 - 2 * t);
};
const easeOutExpo = (x) => {
  const t = clamp(x, 1e-9, 1);
  return x <= 0 ? 0 : t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
};
const easeOutBack = (x, s = 1.28) => {
  const t = clamp(x, 0, 1) - 1;
  return t * t * ((s + 1) * t + s) + 1;
};
const easeInOutCubic = (x) => {
  const t = clamp(x, 0, 1);
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
};
const hash11 = (p) => {
  const s = Math.sin(p * 127.1 + 311.7) * 43758.5453123;
  return s - Math.floor(s);
};
const vnoise = (x) => {
  const i = Math.floor(x);
  const f = x - i;
  const u = f * f * (3 - 2 * f);
  return lerp(hash11(i), hash11(i + 1), u);
};

function armorPlatePath(g, x, y, w, h, cut = 22) {
  const c = Math.min(cut, w * 0.25, h * 0.35);
  g.beginPath();
  g.moveTo(x + c, y);
  g.lineTo(x + w - c, y);
  g.lineTo(x + w, y + c);
  g.lineTo(x + w, y + h - c);
  g.lineTo(x + w - c, y + h);
  g.lineTo(x + c, y + h);
  g.lineTo(x, y + h - c);
  g.lineTo(x, y + c);
  g.closePath();
}

function drawArmorPlate(g, x, y, w, h, opts = {}) {
  const {
    cut = 22,
    fill = MIL.plateFill,
    stroke = MIL.borderSand,
    lineW = 2.0,
    rivets = true,
    hazardTopRight = false,
    accentBarLeft = null,
  } = opts;

  g.save();
  armorPlatePath(g, x, y, w, h, cut);
  g.fillStyle = fill;
  g.fill();
  g.lineWidth = lineW;
  g.strokeStyle = stroke;
  g.stroke();

  if (accentBarLeft) {
    g.fillStyle = accentBarLeft;
    g.fillRect(x + 2, y + cut + 6, 6, Math.max(8, h - (cut + 6) * 2));
  }

  if (hazardTopRight) {
    g.save();
    armorPlatePath(g, x, y, w, h, cut);
    g.clip();
    g.fillStyle = 'rgba(213, 174, 92, 0.16)';
    for (let i = 0; i < 6; i++) {
      const sx = x + w - 165 + i * 26;
      g.beginPath();
      g.moveTo(sx, y);
      g.lineTo(sx + 13, y);
      g.lineTo(sx - 15, y + 36);
      g.lineTo(sx - 28, y + 36);
      g.closePath();
      g.fill();
    }
    g.restore();
  }

  if (rivets) {
    const off = Math.max(14, cut * 0.68);
    const pts = [
      [x + off, y + off],
      [x + w - off, y + off],
      [x + off, y + h - off],
      [x + w - off, y + h - off],
    ];
    g.fillStyle = 'rgba(213, 174, 92, 0.45)';
    for (const [rx, ry] of pts) {
      g.beginPath();
      g.arc(rx, ry, 3.2, 0, Math.PI * 2);
      g.fill();
    }
  }
  g.restore();
}

function buildCamoOverlayCanvas() {
  const c = document.createElement('canvas');
  c.width = 270;
  c.height = 270;
  const g = c.getContext('2d');
  const px = 6;
  for (let y = 0; y < c.height; y += px) {
    for (let x = 0; x < c.width; x += px) {
      const n = vnoise(x * 0.055 + y * 0.017) * 0.65 + vnoise(y * 0.075 - x * 0.02) * 0.35;
      if (n > 0.62) g.fillStyle = 'rgba(72, 92, 46, 0.16)';
      else if (n > 0.44) g.fillStyle = 'rgba(38, 49, 27, 0.14)';
      else g.fillStyle = 'rgba(12, 16, 9, 0.06)';
      g.fillRect(x, y, px, px);
    }
  }
  return c;
}
const CAMO_TILE = buildCamoOverlayCanvas();

function makeCamera3D(pos, target, fovDeg = 46, roll = 0) {
  let fx = target[0] - pos[0], fy = target[1] - pos[1], fz = target[2] - pos[2];
  const fl = Math.hypot(fx, fy, fz) || 1;
  fx /= fl; fy /= fl; fz /= fl;
  let rx = -fz, ry = 0, rz = fx;
  const rl = Math.hypot(rx, ry, rz) || 1;
  rx /= rl; ry /= rl; rz /= rl;
  let ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
  if (roll !== 0) {
    const cr = Math.cos(roll), sr = Math.sin(roll);
    const nrx = rx * cr + ux * sr, nry = ry * cr + uy * sr, nrz = rz * cr + uz * sr;
    const nux = ux * cr - rx * sr, nuy = uy * cr - ry * sr, nuz = uz * cr - rz * sr;
    rx = nrx; ry = nry; rz = nrz;
    ux = nux; uy = nuy; uz = nuz;
  }
  const focal = (H * 0.5) / Math.tan((fovDeg * Math.PI) / 360);
  return { pos, fx, fy, fz, rx, ry, rz, ux, uy, uz, focal };
}

function project3D(cam, x, y, z) {
  const dx = x - cam.pos[0], dy = y - cam.pos[1], dz = z - cam.pos[2];
  const cz = dx * cam.fx + dy * cam.fy + dz * cam.fz;
  if (cz <= 0.15) return null;
  const cx = dx * cam.rx + dy * cam.ry + dz * cam.rz;
  const cy = dx * cam.ux + dy * cam.uy + dz * cam.uz;
  const s = cam.focal / cz;
  return { x: W * 0.5 + cx * s, y: H * 0.5 - cy * s, z: cz, s };
}

function drawLine3D(g, cam, p1, p2) {
  const a = project3D(cam, p1[0], p1[1], p1[2]);
  const b = project3D(cam, p2[0], p2[1], p2[2]);
  if (!a || !b) return;
  g.beginPath();
  g.moveTo(a.x, a.y);
  g.lineTo(b.x, b.y);
  g.stroke();
}

const EMBER_PTS = Array.from({ length: 160 }, (_, i) => ({
  x: (hash11(i * 3.1) - 0.5) * 18,
  y: (hash11(i * 7.7) - 0.35) * 14,
  z: -hash11(i * 11.3) * 24 + 4,
  r: 1.3 + hash11(i * 5.9) * 2.5,
  warm: hash11(i * 2.3) > 0.42,
}));

function draw3DTacticalField(g, cam, opts = {}) {
  const {
    gridY = -2.4,
    gridOpacity = 0.24,
    showDome = false,
    domePos = [0, -0.35, 0],
    domeRadius = 2.85,
    domeRot = 0,
    domeColor = 'rgba(143, 209, 88, 0.28)',
    ringColorA = 'rgba(213, 174, 92, 0.38)',
    ringColorB = 'rgba(143, 209, 88, 0.36)',
    dustRot = 0,
    dustZOffset = 0,
    dustAlpha = 0.50,
  } = opts;

  g.save();
  if (gridOpacity > 0.01) {
    g.lineWidth = 1.25;
    for (let gx = -12; gx <= 12; gx += 1.5) {
      g.strokeStyle =
        gx === 0
          ? `rgba(213, 174, 92, ${(gridOpacity * 1.45).toFixed(3)})`
          : `rgba(98, 120, 62, ${gridOpacity.toFixed(3)})`;
      drawLine3D(g, cam, [gx, gridY, 6], [gx, gridY, -24]);
    }
    for (let gz = 6; gz >= -24; gz -= 1.5) {
      g.strokeStyle = `rgba(98, 120, 62, ${(gridOpacity * 0.8).toFixed(3)})`;
      drawLine3D(g, cam, [-12, gridY, gz], [12, gridY, gz]);
    }
  }

  if (showDome) {
    const [dx0, dy0, dz0] = domePos;
    g.strokeStyle = domeColor;
    g.lineWidth = 1.6;
    for (let li = 1; li <= 5; li++) {
      const phi = (li / 5.5) * (Math.PI * 0.5);
      const ry = Math.cos(phi) * domeRadius;
      const rr = Math.sin(phi) * domeRadius;
      let prev = null;
      g.beginPath();
      for (let s = 0; s <= 28; s++) {
        const th = domeRot + (s / 28) * Math.PI * 2;
        const p = project3D(cam, dx0 + Math.cos(th) * rr, dy0 + ry, dz0 + Math.sin(th) * rr);
        if (p) {
          if (!prev) g.moveTo(p.x, p.y);
          else g.lineTo(p.x, p.y);
        }
        prev = p;
      }
      g.stroke();
    }
    for (let ri = 0; ri < 3; ri++) {
      const rad = domeRadius * (1.05 + ri * 0.16);
      const tiltX = 1.18 + Math.sin(domeRot * 1.6 + ri) * 0.22;
      const spinY = domeRot * (ri % 2 ? -1.4 : 1.2) + ri;
      g.strokeStyle = ri === 1 ? ringColorB : ringColorA;
      g.lineWidth = 2.0 - ri * 0.3;
      g.beginPath();
      let prev = null;
      for (let s = 0; s <= 40; s++) {
        const a = (s / 40) * Math.PI * 2;
        const lx = Math.cos(a) * rad;
        const ly = Math.sin(a) * rad * Math.cos(tiltX);
        const lz = Math.sin(a) * rad * Math.sin(tiltX);
        const wx = lx * Math.cos(spinY) - lz * Math.sin(spinY);
        const wz = lx * Math.sin(spinY) + lz * Math.cos(spinY);
        const p = project3D(cam, dx0 + wx, dy0 + 0.5 + ly, dz0 + wz);
        if (p) {
          if (!prev) g.moveTo(p.x, p.y);
          else g.lineTo(p.x, p.y);
        }
        prev = p;
      }
      g.stroke();
    }
  }

  if (dustAlpha > 0.01) {
    const cr = Math.cos(dustRot), sr = Math.sin(dustRot);
    for (let i = 0; i < EMBER_PTS.length; i++) {
      const d = EMBER_PTS[i];
      const rx = d.x * cr - d.z * sr;
      const rz = d.x * sr + d.z * cr + dustZOffset;
      const p = project3D(cam, rx, d.y, rz);
      if (!p || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) continue;
      const depthFade = clamp(1.35 - p.z / 22, 0.08, 1);
      const rad = clamp(d.r * (7.5 / p.z), 0.8, 5.0);
      g.fillStyle = d.warm
        ? `rgba(218, 168, 82, ${(dustAlpha * depthFade).toFixed(3)})`
        : `rgba(143, 209, 88, ${(dustAlpha * 0.80 * depthFade).toFixed(3)})`;
      g.beginPath();
      g.arc(p.x, p.y, rad, 0, Math.PI * 2);
      g.fill();
    }
  }
  g.restore();
}

const masterCanvas = document.getElementById('master');
const mctx = masterCanvas.getContext('2d', { alpha: false, willReadFrequently: true });

const frameCanvas = document.createElement('canvas');
frameCanvas.width = W;
frameCanvas.height = H;
const ctx = frameCanvas.getContext('2d', { alpha: false });

const ASSET_PATHS = {
  bgDugout: '/assets/images/bg_trench_dugout_dusk.jpg',
  bgArmor: '/assets/images/bg_armor_plate_camo.jpg',
  bgCrates: '/assets/images/bg_military_crates_olive.jpg',
  logoFullLight: '/assets/brand/logo_full_light.png',
  logoFullSand: '/assets/brand/logo_full_sand.png',
  logoShieldLight: '/assets/brand/logo_shield_light.png',
  logoShieldSand: '/assets/brand/logo_shield_sand.png',
  ecoPro3: '/assets/real_power/ecoflow_delta_pro3_rgba.png',
  ecoSolar: '/assets/real_power/ecoflow_solar_kit_rgba.png',
  dji1000: '/assets/real_power/dji_power_1000_rgba.png',
  jackeryV2: '/assets/real_power/jackery_2000_v2_rgba.png',
  bluettiAC: '/assets/real_power/bluetti_ac200pl_rgba.png',
  allpowersR: '/assets/real_power/allpowers_r_series_rgba.png',
};
const IMGS = {};
const BLUR_IMGS = {};

function createBlurredCopy(img, radiusPx, maxDim = 720) {
  const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
  const cw = Math.max(16, Math.round(img.width * scale));
  const ch = Math.max(16, Math.round(img.height * scale));
  const c = document.createElement('canvas');
  c.width = cw + radiusPx * 4;
  c.height = ch + radiusPx * 4;
  const g = c.getContext('2d');
  g.filter = `blur(${radiusPx}px)`;
  g.drawImage(img, radiusPx * 2, radiusPx * 2, cw, ch);
  return c;
}

function setFittedFont(g, text, maxW, maxPx, minPx, family, weight = '900') {
  let size = maxPx;
  while (size > minPx) {
    g.font = `${weight} ${size}px ${family}`;
    if (g.measureText(text).width <= maxW) break;
    size -= 2;
  }
  g.font = `${weight} ${size}px ${family}`;
  return size;
}

function drawCoverImage(g, img, zoom = 1.0, panX = 0, panY = 0, alpha = 1.0) {
  const iw = img.width, ih = img.height;
  const scale = Math.max(W / iw, H / ih) * zoom;
  const dw = iw * scale, dh = ih * scale;
  const dx = (W - dw) * 0.5 + panX, dy = (H - dh) * 0.5 + panY;
  g.save();
  g.globalAlpha = alpha;
  g.drawImage(img, dx, dy, dw, dh);
  g.globalAlpha = alpha * 0.42;
  const pat = g.createPattern(CAMO_TILE, 'repeat');
  if (pat) {
    g.fillStyle = pat;
    g.fillRect(0, 0, W, H);
  }
  g.restore();
}

function drawLogoAspect(g, img, cx, cy, targetH, alpha = 1.0) {
  const aspect = img.width / img.height;
  const dh = targetH, dw = dh * aspect;
  g.save();
  g.globalAlpha = alpha;
  g.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
  g.restore();
  return { dw, dh };
}

function drawCutoutFit(g, img, blurCanvas, cx, cy, maxW, maxH, opts = {}) {
  const {
    alpha = 1,
    rot = 0,
    dof = 0,
    glowColor = null,
    glowAlpha = 0,
    shadowAlpha = 0.78,
  } = opts;
  if (alpha <= 0.005) return null;
  const sc = Math.min(maxW / img.width, maxH / img.height);
  const dw = img.width * sc;
  const dh = img.height * sc;

  g.save();
  g.globalAlpha = alpha;
  g.translate(cx, cy);
  if (rot) g.rotate(rot);

  if (shadowAlpha > 0.01) {
    const sg = g.createRadialGradient(0, dh * 0.47, 4, 0, dh * 0.47, dw * 0.62);
    sg.addColorStop(0, `rgba(0,0,0,${(0.86 * shadowAlpha).toFixed(3)})`);
    sg.addColorStop(0.55, `rgba(0,0,0,${(0.38 * shadowAlpha).toFixed(3)})`);
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    g.save();
    g.scale(1, 0.23);
    g.fillStyle = sg;
    g.beginPath();
    g.arc(0, (dh * 0.47) / 0.23, dw * 0.62, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  if (glowColor && glowAlpha > 0.01) {
    const rg = g.createRadialGradient(0, 0, dw * 0.10, 0, 0, Math.max(dw, dh) * 0.58);
    rg.addColorStop(0, glowColor.replace('ALPHA', (0.38 * glowAlpha).toFixed(3)));
    rg.addColorStop(0.65, glowColor.replace('ALPHA', (0.14 * glowAlpha).toFixed(3)));
    rg.addColorStop(1, glowColor.replace('ALPHA', '0'));
    g.fillStyle = rg;
    g.fillRect(-dw * 0.85, -dh * 0.70, dw * 1.7, dh * 1.4);
  }

  if (dof > 0.04 && blurCanvas) {
    const sharpA = clamp(1 - dof * 0.92, 0.08, 1);
    g.save();
    g.globalAlpha = alpha * sharpA;
    g.drawImage(img, -dw / 2, -dh / 2, dw, dh);
    g.globalAlpha = alpha * clamp(dof, 0, 0.92);
    const padRatio = 28 / Math.max(16, blurCanvas.width - 56);
    g.drawImage(
      blurCanvas,
      -dw / 2 - dw * padRatio,
      -dh / 2 - dh * padRatio,
      dw * (1 + padRatio * 2),
      dh * (1 + padRatio * 2)
    );
    g.restore();
  } else {
    g.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  }
  g.restore();
  return { cx, cy, dw, dh };
}

function drawKineticHeadline(g, lines, baseY, progress, opts = {}) {
  const {
    maxSize = 68,
    family = 'RussoOne',
    align = 'left',
    accentIndex = 1,
    accentColor = MIL.sand,
    subText = null,
    maxW = SAFE_W,
  } = opts;
  const baseX = align === 'center' ? W / 2 : SAFE_PAD;
  let curY = baseY;

  for (let i = 0; i < lines.length; i++) {
    const lp = clamp((progress - i * 0.12) / 0.56, 0, 1);
    if (lp <= 0.005) {
      curY += maxSize * 1.12;
      continue;
    }
    const eased = easeOutExpo(lp);
    const txt = lines[i];
    const sz = setFittedFont(g, txt, maxW, maxSize, 30, family, '900');
    const lineH = sz * 1.15;

    g.save();
    g.beginPath();
    g.rect(0, curY - sz * 1.08, W, lineH * 1.18);
    g.clip();

    const ySlide = (1 - eased) * (sz * 0.95);
    g.globalAlpha = clamp(0.38 + lp * 1.8, 0, 1);
    g.textAlign = align;
    g.textBaseline = 'alphabetic';

    g.fillStyle = 'rgba(0,0,0,0.82)';
    g.fillText(txt, baseX + 4, curY + ySlide + 6);

    g.fillStyle = i === accentIndex ? accentColor : MIL.bone;
    g.fillText(txt, baseX, curY + ySlide);
    g.restore();

    curY += lineH;
  }

  if (subText && progress > 0.22) {
    const sp = easeOutExpo((progress - 0.22) / 0.55);
    g.save();
    g.globalAlpha = sp;
    const sSize = setFittedFont(g, subText, maxW - 28, 25, 17, 'JetMono', '800');
    if (align === 'center') {
      g.textAlign = 'center';
      g.fillStyle = MIL.sand;
      g.fillText(subText, W / 2, curY + 18 + (1 - sp) * 14);
    } else {
      g.fillStyle = MIL.sand;
      g.fillRect(SAFE_PAD, curY + 4, 6, sSize + 10);
      g.textAlign = 'left';
      g.fillStyle = MIL.ash;
      g.fillText(subText, SAFE_PAD + 20, curY + sSize + 4 + (1 - sp) * 12);
    }
    g.restore();
    curY += sSize + 28;
  }
  return curY;
}

function drawMilitaryChannelBadge(g, kind, cx, cy) {
  g.save();
  g.translate(cx, cy);
  g.beginPath();
  g.arc(0, 0, 40, 0, Math.PI * 2);
  g.fillStyle = 'rgba(12, 16, 9, 0.96)';
  g.fill();
  g.lineWidth = 2.4;
  g.strokeStyle = kind === 'avito' ? MIL.phosphor : kind === 'tg' ? MIL.sand : MIL.olive;
  g.stroke();

  if (kind === 'tg') {
    g.fillStyle = MIL.sandBright;
    g.beginPath();
    g.moveTo(-20, 1);
    g.lineTo(18, -15);
    g.lineTo(10, 17);
    g.lineTo(0, 6);
    g.lineTo(-9, 13);
    g.lineTo(-8, 3);
    g.closePath();
    g.fill();
  } else if (kind === 'vk') {
    g.font = '900 30px RussoOne';
    g.fillStyle = MIL.bone;

function resetCanvasState(targetCtx) {
  targetCtx.globalAlpha = 1;
  targetCtx.globalCompositeOperation = 'source-over';
  targetCtx.shadowBlur = 0;
  targetCtx.shadowOffsetX = 0;
  targetCtx.shadowOffsetY = 0;
  targetCtx.lineWidth = 1;
  targetCtx.textBaseline = 'alphabetic';
  targetCtx.textAlign = 'left';
  targetCtx.fillStyle = MIL.bgDark;
  targetCtx.fillRect(0, 0, W, H);
}

function renderWorldOnly(targetCtx, tc) {
  resetCanvasState(targetCtx);
  const sIdx = getSceneIndex(tc);
  if (sIdx === 0) renderScene1(targetCtx, tc);
  else if (sIdx === 1) renderScene2(targetCtx, tc);
  else if (sIdx === 2) renderScene3(targetCtx, tc);
  else if (sIdx === 3) renderScene4(targetCtx, tc);
  else renderScene5(targetCtx, tc);

  for (let i = 1; i <= 4; i++) {
    const dt = tc - SYNC.cuts[i];
    if (Math.abs(dt) < 0.09) {
      const k = 1 - Math.abs(dt) / 0.09;
      const wipeX = lerp(-W * 0.3, W * 1.3, invLerp(-0.09, 0.09, dt));
      targetCtx.save();
      const lg = targetCtx.createLinearGradient(wipeX - 240, 0, wipeX + 240, 0);
      lg.addColorStop(0, 'rgba(213,174,92,0)');
      lg.addColorStop(0.5, `rgba(232,192,104,${(0.36 * k).toFixed(3)})`);
      lg.addColorStop(1, 'rgba(132,158,84,0)');
      targetCtx.fillStyle = lg;
      targetCtx.fillRect(0, 0, W, H);
      targetCtx.restore();
    }
  }
}

function motionVelocityFactor(t) {
  for (let i = 1; i <= 4; i++) {
    if (Math.abs(t - SYNC.cuts[i]) < 0.14) return 1.0;
  }
  if (t >= 0.12 && t <= 0.55) return 0.65;
  if (Math.abs(t - SYNC.s4Drop) < 0.25) return 0.75;
  if (Math.abs(t - SYNC.s5Slam) < 0.25) return 0.75;
  return 0.0;
}

window.renderAt = function renderAt(t) {
  const tc = clamp(t, 0, DURATION);
  const sIdx = getSceneIndex(tc);
  const sLo = SYNC.cuts[sIdx];
  const sHi = SYNC.cuts[sIdx + 1] - 1e-4;
  const vel = motionVelocityFactor(tc);

  if (vel <= 0.01) {
    renderWorldOnly(mctx, tc);
  } else {
    const samples = 3;
    const shutter = (1 / 90) * vel;
    mctx.fillStyle = MIL.bgDark;
    mctx.fillRect(0, 0, W, H);
    for (let s = 0; s < samples; s++) {
      const subT = clamp(tc - shutter * 0.5 + (shutter * s) / (samples - 1), sLo, sHi);
      renderWorldOnly(ctx, subT);
      mctx.save();
      mctx.globalAlpha = 1 / (s + 1);
      mctx.drawImage(frameCanvas, 0, 0);
      mctx.restore();
    }
  }

  drawScreenSpaceHUD(mctx, tc, sIdx);
};

window.getFrameSignature = function getFrameSignature() {
  const data = mctx.getImageData(0, 0, W, H).data;
  let h1 = 0x811c9dc5;
  for (let i = 0; i < data.length; i += 64) {
    h1 ^= data[i];
    h1 = Math.imul(h1, 0x01000193) >>> 0;
  }
  return h1.toString(16).padStart(8, '0');
};

          img.src = url;
        })
    )
  );

  for (const wt of [0.05, 2.2, 6.5, 10.2, 15.0, 20.5, 26.8, 29.5]) {
    window.renderAt(wt);
  }
  await document.fonts.ready;
  window.renderAt(0);
  window.__SCENE_READY = true;
  return true;
})();
</script>
</body>
