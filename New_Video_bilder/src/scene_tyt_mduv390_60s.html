<html lang="ru">
<head>

<title>В ОКОПЕ · Цифровая радиостанция TYT MD-UV390 Plus DMR AES-256 IP67 10 Вт (1080×1920 @ 60fps)</title>

<body>
<canvas id="master" width="1080" height="1920"></canvas>

<script type="module">
const W = 1080;
const H = 1920;
const DURATION = 72.0;
const BPM = 174.2;
const BEAT = 60.0 / BPM;
const PAD = 56;
const SAFE_W = W - PAD * 2; // 968px

const MIL = {
  bg: '#090e09',
  panel: 'rgba(13, 20, 13, 0.93)',
  panelHi: 'rgba(20, 30, 19, 0.95)',
  panelEmerald: 'rgba(11, 29, 21, 0.94)',
  sand: '#d5ae5c',
  sandHi: '#f0d38b',
  olive: '#849e54',
  phosphor: '#8fd158',
  emerald: '#4ae88a',
  cyan: '#42dcfa',
  amber: '#f4ae46',
  redPlus: '#ef4d4d',
  bone: '#f4f1e8',
  ash: '#c8cdc2',
  muted: '#8f9988',
  borderSand: 'rgba(213, 174, 92, 0.54)',
  borderEmerald: 'rgba(74, 232, 138, 0.52)',
};

// Exact sample-locked 60fps cut points from src/tyt_sync_map.json (4,320 frames @ 60fps)
const CUTS = [
  0.000000,   // S1 [0..459]     TYT MD-UV390 Plus · 10 Вт · AES-256
  7.650000,   // S2 [459..1210]  Два диапазона VHF/UHF · DMR TDMA · MotoTRBO
  20.166667,  // S3 [1210..1799] AES-256 · 3000 каналов · 120 000 контактов · 8 ч записи
  29.983333,  // S4 [1799..2312] АКБ 3600 мА·ч (BATT-TYPEC-XL) с USB Type-C + Доп. АКБ в наличии
  38.533333,  // S5 [2312..2930] Литое шасси · IP67 · −30…+60 °C · 0.20 мкВ · −60 дБ
  48.833333,  // S6 [2930..3462] Полный комплект · 2 антенны 12 и 38 см · стакан + БП
  57.700000,  // S7 [3462..3857] Оптом и в розницу · с НДС и без НДС
  64.283333,  // S8 [3857..4320] Заказ в магазине «В ОКОПЕ» · Telegram · VK · Авито + 2.32s Neurofunk outro
  72.000000,
];

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const easeOutBack = (x) => {
  const c1 = 1.48, c3 = c1 + 1;
  const p = clamp(x, 0, 1) - 1;
  return 1 + c3 * p * p * p + c1 * p * p;
};
const prog = (t, t0, dur) => clamp((t - t0) / Math.max(0.0001, dur), 0, 1);

function hash2(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return n - Math.floor(n);
}

const canvas = document.getElementById('master');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const ASSET_PATHS = {
  handset: '/assets/tyt_mduv390/tyt_handset_upright_rgba.png',
  kitFront: '/assets/tyt_mduv390/tyt_kit_front_rgba.png',
  chassisPair: '/assets/tyt_mduv390/tyt_chassis_pair_rgba.png',
  photoKitFront: '/assets/tyt_mduv390/tyt_1_full_kit_front.jpg',
  photoTypeC: '/assets/tyt_mduv390/tyt_2_typec_macro.jpg',
  photoChassis: '/assets/tyt_mduv390/tyt_3_chassis_batt_label.jpg',
  photoOpenKit: '/assets/tyt_mduv390/tyt_4_full_kit_open_chassis.jpg',
  photoSpecs: '/assets/tyt_mduv390/tyt_5_front_box_specs.jpg',
  logoFullSand: '/assets/brand/logo_full_sand.png',
  logoShieldSand: '/assets/brand/logo_shield_sand.png',
  bgRadar: '/assets/images/bg_radar_dusk.jpg',
  bgTrench: '/assets/images/bg_trench_dugout_dusk.jpg',
  bgArmor: '/assets/images/bg_armor_plate_camo.jpg',
  bgCrates: '/assets/images/bg_military_crates_olive.jpg',
};

const IMG = {};

async function loadAllAssets() {
  await document.fonts.ready;
  const warmCanvas = document.createElement('canvas');
  warmCanvas.width = 64;
  warmCanvas.height = 64;
  const wctx = warmCanvas.getContext('2d');
  for (const spec of [
    "900 48px 'RussoOne'",
    "400 48px 'RubikDirt'",
    "800 40px 'Tektur'",
    "600 32px 'Tektur'",
    "900 52px 'FiraCond'",
    "700 28px 'JetMono'",
    "500 24px 'JetMono'",
    "700 30px 'RobotoBold'",
  ]) {
    await document.fonts.load(spec, 'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ0123456789AESDMRTYTWIP');
    wctx.font = spec;
    wctx.fillText('TYT MD-UV390 Plus AES-256 IP67 3600 мАч В ОКОПЕ', 2, 32);
  }
  await Promise.all(
    Object.entries(ASSET_PATHS).map(async ([k, url]) => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.src = url;
      await im.decode();
      IMG[k] = im;
    })
  );
}

const GRAIN_TILE = (() => {
  const g = document.createElement('canvas');
  g.width = 256;
  g.height = 256;
  const gc = g.getContext('2d');
  const id = gc.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) {
    const v = Math.floor(hash2(i % 256, (i / 256) | 0) * 255);
    id.data[i * 4] = v;
    id.data[i * 4 + 1] = v;
    id.data[i * 4 + 2] = v;
    id.data[i * 4 + 3] = 14;
  }
  gc.putImageData(id, 0, 0);
  return g;
})();

function fitFont(text, maxW, weight, baseSize, family) {
  let sz = baseSize;
  ctx.font = `${weight} ${sz}px '${family}'`;
  const w = ctx.measureText(text).width;
  if (w > maxW && w > 0) {
    sz = Math.max(13, Math.floor(sz * (maxW / w) * 0.985));
    ctx.font = `${weight} ${sz}px '${family}'`;
  }
  return sz;
}

function drawFittedText(text, x, y, maxW, { weight = 800, size = 44, family = 'RussoOne', color = MIL.bone, align = 'left', baseline = 'alphabetic', shadow = true } = {}) {
  ctx.save();
  fitFont(text, maxW, weight, size, family);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  if (shadow) {
    ctx.shadowColor = 'rgba(0,0,0,0.76)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 3;
  }
  ctx.fillText(text, x, y);
  ctx.restore();
}

function roundRectPath(x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawTacticalCard(x, y, w, h, { fill = MIL.panel, stroke = MIL.borderSand, r = 16, accent = MIL.sand, glow = 0 } = {}) {
  ctx.save();
  if (glow > 0) {
    ctx.shadowColor = accent;
    ctx.shadowBlur = glow;
  }
  roundRectPath(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2;
  ctx.strokeStyle = stroke;
  ctx.stroke();

  const L = Math.min(18, w * 0.08, h * 0.25);
  ctx.strokeStyle = accent;
  ctx.lineWidth = 3;
  for (const [cx, cy, sx, sy] of [
    [x + 1, y + 1, 1, 1],
    [x + w - 1, y + 1, -1, 1],
    [x + 1, y + h - 1, 1, -1],
    [x + w - 1, y + h - 1, -1, -1],
  ]) {
    ctx.beginPath();
    ctx.moveTo(cx + sx * L, cy);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx, cy + sy * L);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCoverImage(im, x, y, w, h, { zoom = 1.0, panX = 0, panY = 0, alpha = 1.0, radius = 0 } = {}) {
  const ir = im.width / im.height;
  const br = w / h;
  let dw, dh;
  if (ir > br) {
    dh = h * zoom;
    dw = dh * ir;
  } else {
    dw = w * zoom;
    dh = dw / ir;
  }
  const dx = x + (w - dw) * 0.5 + panX;
  const dy = y + (h - dh) * 0.5 + panY;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (radius > 0) roundRectPath(x, y, w, h, radius);
  else { ctx.beginPath(); ctx.rect(x, y, w, h); }
  ctx.clip();
  ctx.drawImage(im, dx, dy, dw, dh);
  ctx.restore();
}

function drawContainImage(im, cx, cy, maxW, maxH, { scale = 1.0, alpha = 1.0, glowColor = null, glowBlur = 0, dropShadow = true } = {}) {
  const s = Math.min(maxW / im.width, maxH / im.height) * scale;
  const dw = im.width * s;
  const dh = im.height * s;
  const dx = cx - dw * 0.5;
  const dy = cy - dh * 0.5;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (glowColor && glowBlur > 0) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = glowBlur;
    ctx.drawImage(im, dx, dy, dw, dh);
  }
  if (dropShadow) {
    ctx.shadowColor = 'rgba(0, 0, 0, 0.80)';
    ctx.shadowBlur = 34;
    ctx.shadowOffsetY = 16;
  }
  ctx.drawImage(im, dx, dy, dw, dh);
  ctx.restore();
  return { x: dx, y: dy, w: dw, h: dh };
}

function drawSceneBackdrop(bgImg, t, scIdx, { tint = 'rgba(8, 13, 9, 0.77)', emeraldRadial = 0.16, beatPulse = 0 } = {}) {
  const sStart = CUTS[scIdx];
  const sDur = CUTS[scIdx + 1] - sStart;
  const u = clamp((t - sStart) / sDur, 0, 1);

  ctx.fillStyle = MIL.bg;
  ctx.fillRect(0, 0, W, H);

  drawCoverImage(bgImg, 0, 0, W, H, {
    zoom: 1.06 + u * 0.055,
    panX: lerp(-16, 16, u) * (scIdx % 2 === 0 ? 1 : -1),
    panY: lerp(-10, 10, u),
    alpha: 0.44,
  });

  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, W, H);

  // Subtle tactical coordinate grid
  ctx.save();
  ctx.strokeStyle = 'rgba(132, 158, 84, 0.065)';
  ctx.lineWidth = 1;
  for (let gx = 60; gx < W; gx += 120) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }
  for (let gy = 80; gy < H; gy += 120) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }
  ctx.restore();

  const rg = ctx.createRadialGradient(W * 0.5, H * 0.49, 30, W * 0.5, H * 0.49, 780);
  rg.addColorStop(0, `rgba(74, 232, 138, ${(emeraldRadial + beatPulse * 0.075).toFixed(3)})`);
  rg.addColorStop(0.55, 'rgba(32, 62, 42, 0.09)');
  rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  const vig = ctx.createRadialGradient(W * 0.5, H * 0.5, 420, W * 0.5, H * 0.5, 1140);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(4, 6, 4, 0.74)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function drawTopHUD(t, scIdx, sectionTag) {
  const y = 52;
  drawTacticalCard(PAD, y, SAFE_W, 92, {
    fill: 'rgba(14, 20, 13, 0.93)',
    stroke: 'rgba(213, 174, 92, 0.48)',
    r: 14,
    accent: MIL.sand,
  });

  drawContainImage(IMG.logoShieldSand, PAD + 48, y + 46, 66, 68, { dropShadow: false });

  drawFittedText('В ОКОПЕ · ЦИФРОВАЯ СВЯЗЬ', PAD + 94, y + 42, 470, {
    weight: 900,
    size: 26,
    family: 'RussoOne',
    color: MIL.sandHi,
    shadow: false,
  });
  drawFittedText(sectionTag, PAD + 94, y + 73, 560, {
    weight: 700,
    size: 19,
    family: 'JetMono',
    color: MIL.emerald,
    shadow: false,
  });

  // Live AES-256 encrypted status pill on right
  const pillW = 248;
  const px = PAD + SAFE_W - pillW - 18;
  roundRectPath(px, y + 20, pillW, 52, 10);
  ctx.fillStyle = 'rgba(74, 232, 138, 0.13)';
  ctx.fill();
  ctx.strokeStyle = MIL.emerald;
  ctx.lineWidth = 2;
  ctx.stroke();

  const blink = 0.55 + 0.45 * Math.sin(t * 7.5);
  ctx.save();
  ctx.globalAlpha = blink;
  ctx.fillStyle = MIL.emerald;
  ctx.beginPath();
  ctx.arc(px + 24, y + 46, 6.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  drawFittedText(`AES-256 · 0${scIdx + 1}/08`, px + 42, y + 53, pillW - 56, {
    weight: 800,
    size: 19,
    family: 'JetMono',
    color: MIL.bone,
    shadow: false,
  });
}

function drawProgressBar(t) {
  const y = 1866;
  ctx.fillStyle = 'rgba(255,255,255,0.11)';
  roundRectPath(PAD, y, SAFE_W, 8, 4);
  ctx.fill();
  const fw = Math.max(8, SAFE_W * clamp(t / DURATION, 0, 1));
  const grd = ctx.createLinearGradient(PAD, 0, PAD + SAFE_W, 0);
  grd.addColorStop(0, MIL.emerald);
  grd.addColorStop(1, MIL.sandHi);
  ctx.fillStyle = grd;
  roundRectPath(PAD, y, fw, 8, 4);
  ctx.fill();
}

// =========================================================================
// SCENE 1 [0.00s .. 7.65s]: HERO HOOK — TYT MD-UV390 Plus · 10W · AES-256
// =========================================================================
function renderScene1(t, beatPulse) {
  const lt = t - CUTS[0];
  drawSceneBackdrop(IMG.bgRadar, t, 0, { emeraldRadial: 0.21, beatPulse });
  drawTopHUD(t, 0, 'TYT MD-UV390 PLUS · DMR DIGITAL + ANALOG');

  const eHead = easeOutCubic(prog(lt, 0.05, 0.42));
  ctx.save();
  ctx.globalAlpha = eHead;
  drawFittedText('TYT MD-UV390', PAD, 248 - (1 - eHead) * 20, SAFE_W, {
    weight: 900,
    size: 86,
    family: 'RussoOne',
    color: MIL.bone,
  });
  // PLUS + 10W + AES-256 headline strip
  drawFittedText('PLUS · 10 ВТ · AES-256', PAD, 336 - (1 - eHead) * 14, SAFE_W, {
    weight: 900,
    size: 58,
    family: 'FiraCond',
    color: MIL.emerald,
  });
  ctx.restore();

  // Animated concentric RF encrypted wave rings behind upright TYT handset
  const cx = 690, cy = 985;
  for (let rIdx = 0; rIdx < 3; rIdx++) {
    const ph = ((t * 0.72 + rIdx / 3) % 1);
    const rad = 135 + ph * 290;
    ctx.save();
    ctx.strokeStyle = `rgba(74, 232, 138, ${((1 - ph) * 0.34).toFixed(3)})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(cx, cy - 120, rad, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Left vertical stack of 4 power badges
  const badges = [
    { k: 'ШИФРОВАНИЕ', v: 'AES-256 BIT', sub: 'Закрытый цифровой радиоканал', acc: MIL.emerald },
    { k: 'МОЩНОСТЬ ПЕРЕДАТЧИКА', v: '10 ВТ / 1 ВТ', sub: 'Дальняя связь в плотной застройке', acc: MIL.sandHi },
    { k: 'ЗАЩИТА КОРПУСА', v: 'IP67 · ЛИТЬЁ', sub: 'Вода, грязь, −30 °C … +60 °C', acc: MIL.cyan },
    { k: 'ПИТАНИЕ В ПОЛЕ', v: '3600 мА·ч TYPE-C', sub: 'Прямая зарядка от повербанка', acc: MIL.amber },
  ];
  badges.forEach((b, i) => {
    const eb = easeOutBack(prog(lt, 0.26 + i * 0.16, 0.44));
    const by = 408 + i * 244;
    ctx.save();
    ctx.globalAlpha = clamp(eb, 0, 1);
    ctx.translate(-(1 - eb) * 38, 0);
    drawTacticalCard(PAD, by, 456, 220, {
      fill: MIL.panelHi,
      stroke: 'rgba(213, 174, 92, 0.50)',
      r: 16,
      accent: b.acc,
      glow: i === 0 ? 12 + beatPulse * 12 : 0,
    });
    drawFittedText(b.k, PAD + 24, by + 46, 408, {
      weight: 800, size: 19, family: 'JetMono', color: b.acc, shadow: false,
    });
    drawFittedText(b.v, PAD + 24, by + 124, 408, {
      weight: 900, size: 54, family: 'FiraCond', color: MIL.bone, shadow: false,
    });
    drawFittedText(b.sub, PAD + 24, by + 178, 408, {
      weight: 700, size: 22, family: 'RobotoBold', color: MIL.ash, shadow: false,
    });
    ctx.restore();
  });

  // Hero upright TYT MD-UV390 handset studio cutout on right
  const eHero = easeOutBack(prog(lt, 0.14, 0.56));
  drawContainImage(IMG.handset, 785, 895 + Math.sin(t * 2.3) * 6, 490, 960, {
    scale: (0.90 + 0.10 * eHero) * (1 + beatPulse * 0.018),
    alpha: clamp(eHero, 0, 1),
    glowColor: 'rgba(74, 232, 138, 0.44)',
    glowBlur: 32 + beatPulse * 18,
  });

  // Bottom summary bar
  const eBot = easeOutCubic(prog(lt, 0.55, 0.45));
  ctx.save();
  ctx.globalAlpha = eBot;
  drawTacticalCard(PAD, 1420, SAFE_W, 404, {
    fill: 'rgba(13, 22, 15, 0.95)',
    stroke: MIL.borderEmerald,
    r: 18,
    accent: MIL.emerald,
  });
  drawContainImage(IMG.kitFront, 775, 1622, 430, 360, {
    scale: 1 + beatPulse * 0.012,
    glowColor: 'rgba(213, 174, 92, 0.30)',
    glowBlur: 20,
  });
  drawFittedText('ЦИФРА DMR + АНАЛОГ', PAD + 28, 1502, 500, {
    weight: 900, size: 44, family: 'FiraCond', color: MIL.sandHi, shadow: false,
  });
  drawFittedText('136–174 И 400–480 МГц', PAD + 28, 1574, 500, {
    weight: 900, size: 46, family: 'RussoOne', color: MIL.bone, shadow: false,
  });
  drawFittedText('СОВМЕСТИМА С MOTOTRBO TIER I & II', PAD + 28, 1646, 500, {
    weight: 800, size: 23, family: 'JetMono', color: MIL.emerald, shadow: false,
  });
  drawFittedText('Оптом и в розницу · С НДС и без НДС', PAD + 28, 1712, 500, {
    weight: 700, size: 25, family: 'RobotoBold', color: MIL.ash, shadow: false,
  });
  drawFittedText('ДОПОЛНИТЕЛЬНЫЕ АКБ В НАЛИЧИИ', PAD + 28, 1776, 500, {
    weight: 800, size: 22, family: 'JetMono', color: MIL.amber, shadow: false,
  });
  ctx.restore();

  drawProgressBar(t);
}

// =========================================================================
// SCENE 2 [7.65s .. 20.17s]: DUAL-BAND VHF/UHF · DMR TDMA · MOTOTRBO
// =========================================================================
function renderScene2(t, beatPulse) {
  const lt = t - CUTS[1];
  drawSceneBackdrop(IMG.bgTrench, t, 1, { emeraldRadial: 0.18, beatPulse });
  drawTopHUD(t, 1, 'ДВА ДИАПАЗОНА · DMR TIER I & II · TDMA');

  drawFittedText('ЦИФРА DMR И АНАЛОГ', PAD, 232, SAFE_W, {
    weight: 900, size: 68, family: 'RussoOne', color: MIL.bone,
  });
  drawFittedText('ДВА ДИАПАЗОНА + MOTOTRBO TIER I & II', PAD, 304, SAFE_W, {
    weight: 900, size: 42, family: 'FiraCond', color: MIL.sandHi,
  });

  // Real box specifications closeup photo panel (tyt_5_front_box_specs.jpg)
  const ePhoto = easeOutCubic(prog(lt, 0.08, 0.50));
  ctx.save();
  ctx.globalAlpha = ePhoto;
  drawTacticalCard(PAD, 344, SAFE_W, 560, {
    fill: '#0e150e',
    stroke: MIL.borderSand,
    r: 18,
    accent: MIL.sandHi,
    glow: 14,
  });
  drawCoverImage(IMG.photoSpecs, PAD + 10, 354, SAFE_W - 20, 540, {
    zoom: 1.03 + 0.05 * clamp(lt / 12.5, 0, 1),
    panX: lerp(-12, 12, clamp(lt / 12.5, 0, 1)),
    radius: 14,
  });

// =========================================================================
// STATELESS MASTER FRAME DISPATCHER (100% BIT-EXACT DETERMINISTIC)
// =========================================================================
function renderFrame(rawTime) {
  const t = clamp(rawTime, 0, DURATION - 1e-4);
  const beatPhase = (t / BEAT) % 1;
  const beatPulse = Math.exp(-beatPhase * 5.2);

  let scIdx = 0;
  for (let i = 0; i < 8; i++) {
    if (t >= CUTS[i] && t < CUTS[i + 1]) {
      scIdx = i;
      break;
    }
  }
  if (t >= CUTS[8] - 1e-3) scIdx = 7;

  switch (scIdx) {
    case 0: renderScene1(t, beatPulse); break;
    case 1: renderScene2(t, beatPulse); break;
    case 2: renderScene3(t, beatPulse); break;
    case 3: renderScene4(t, beatPulse); break;
    case 4: renderScene5(t, beatPulse); break;
    case 5: renderScene6(t, beatPulse); break;
    case 6: renderScene7(t, beatPulse); break;
    default: renderScene8(t, beatPulse); break;
  }

  // Crisp subtle tactical shutter flash across cut boundaries
  if (scIdx > 0) {
    const dtCut = t - CUTS[scIdx];
    if (dtCut >= 0 && dtCut < 0.14) {
      const fa = (1 - dtCut / 0.14) * 0.22;
      ctx.fillStyle = `rgba(214, 236, 224, ${fa.toFixed(4)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // Deterministic film grain pass across entire 1080×1920 frame
  const ox = ((Math.floor(t * 60) * 37) % 128);
  const oy = ((Math.floor(t * 60) * 53) % 128);
  for (let gx = -ox; gx < W; gx += 256) {
    for (let gy = -oy; gy < H; gy += 256) {
      ctx.drawImage(GRAIN_TILE, gx, gy);
    }
  }
}

window.renderAt = renderFrame;
window.getFrameSignature = function () {
  const d = ctx.getImageData(0, 0, W, H).data;
  let h = 2166136261;
  for (let i = 0; i < d.length; i += 97) {
    h ^= d[i];
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
};

window.__READY_PROMISE = loadAllAssets().then(() => {
  renderFrame(0);
  return true;
});
