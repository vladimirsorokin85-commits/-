<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>В ОКОПЕ · Дрон-детектор БПЛА «АЛДАН-12» 100 МГц – 13 ГГц + Часы в подарок (1080×1920 @ 60fps)</title>
<style>
  @font-face {
    font-family: 'RussoOne';
    src: url('/fonts/RussoOne-Regular.ttf') format('truetype');
    font-weight: 400 900;
  }
  @font-face {

<body>
<canvas id="master" width="1080" height="1920"></canvas>

<script type="module">
const W = 1080;
const H = 1920;
const DURATION = 58.0;
const BPM = 174.2;
const BEAT = 60.0 / BPM;
const PAD = 56;
const SAFE_W = W - PAD * 2; // 968px

const MIL = {
  bg: '#090e09',
  panel: 'rgba(14, 20, 13, 0.93)',
  panelHi: 'rgba(21, 30, 18, 0.95)',
  panelAmber: 'rgba(32, 24, 12, 0.94)',
  panelEmerald: 'rgba(11, 29, 20, 0.94)',
  sand: '#d5ae5c',
  sandHi: '#f6d88c',
  olive: '#849e54',
  phosphor: '#93d85c',
  emerald: '#4ae88a',
  cyan: '#42dcfa',
  amber: '#f6b347',
  redAlert: '#f25454',
  bone: '#f4f1e8',
  ash: '#c8cdc2',
  muted: '#8f9988',
  borderSand: 'rgba(213, 174, 92, 0.56)',
  borderEmerald: 'rgba(74, 232, 138, 0.52)',
};

// Exact sample-locked 60fps cut points from src/aldan12_sync_map.json (3,480 frames @ 60fps = 58.000s)
const CUTS = [
  0.000000,   // S1 [0..559]     АЛДАН-12 · 100 МГц–13 ГГц · Часы в подарок
  9.316667,   // S2 [559..1155]  360° · До 1000 м · До 9 БПЛА · 13 настраиваемых зон
  19.250000,  // S3 [1155..1778] DJI · FPV · AUTEL + Фильтр своих раций 425–445 МГц
  29.633333,  // S4 [1778..2218] До 15 часов · 2 съёмных АКБ 5400 мА·ч · USB Type-C
  36.966667,  // S5 [2218..2891] 298 г · −10…+55 °C · Звук/Свет/Вибро · Русский язык · ЕАЭС 2030
  48.183333,  // S6 [2891..3480] Оптом и в розницу · НДС / без НДС · В ОКОПЕ (TG · VK · Авито)
  58.000000,
];

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const easeOutBack = (x) => {
  const c1 = 1.48, c3 = c1 + 1;
  const p = clamp(x, 0, 1) - 1;
  return 1 + c3 * p * p * p + c1 * p * p;
};
const prog = (t, t0, dur) => clamp((t - t0) / Math.max(0.0001, dur), 0, 1);

function hash2(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return n - Math.floor(n);
}

const canvas = document.getElementById('master');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const ASSET_PATHS = {
  trio: '/assets/aldan_12/aldan_trio_rgba.png',
  unit: '/assets/aldan_12/aldan_unit_rgba.png',
  pair: '/assets/aldan_12/aldan_pair_rgba.png',
  watch: '/assets/aldan_12/aldan_watch_rgba.png',
  photoPair: '/assets/aldan_12/aldan_1_pair_antennas.jpg',
  photoTrio: '/assets/aldan_12/aldan_2_trio_watch.jpg',
  photoWatchBox: '/assets/aldan_12/aldan_3_watch_macro.jpg',
  photoFlatlay: '/assets/aldan_12/aldan_4_kit_flatlay.jpg',
  logoFullSand: '/assets/brand/logo_full_sand.png',
  logoShieldSand: '/assets/brand/logo_shield_sand.png',
  bgRadar: '/assets/images/bg_radar_dusk.jpg',
  bgTrench: '/assets/images/bg_trench_dugout_dusk.jpg',
  bgArmor: '/assets/images/bg_armor_plate_camo.jpg',
  bgCrates: '/assets/images/bg_military_crates_olive.jpg',
};

const IMG = {};

async function loadAllAssets() {
  await document.fonts.ready;
  const warmCanvas = document.createElement('canvas');
  warmCanvas.width = 64;
  warmCanvas.height = 64;
  const wctx = warmCanvas.getContext('2d');
  for (const spec of [
    "900 48px 'RussoOne'",
    "400 48px 'RubikDirt'",
    "800 40px 'Tektur'",
    "600 32px 'Tektur'",
    "900 52px 'FiraCond'",
    "700 28px 'JetMono'",
    "500 24px 'JetMono'",
    "700 30px 'RobotoBold'",
  ]) {
    await document.fonts.load(spec, 'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ0123456789DJIFPVAUTEL');
    wctx.font = spec;
    wctx.fillText('АЛДАН-12 100 МГц 13 ГГц DJI FPV AUTEL ЕАЭС 2030', 2, 32);
  }
  await Promise.all(
    Object.entries(ASSET_PATHS).map(async ([k, url]) => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.src = url;
      await im.decode();
      IMG[k] = im;
    })
  );
}

// Single pre-baked full-screen tactile matte film finish (zero per-frame multi-blit overhead & clean H.264 bitrate!)
const GRAIN_FULL = (() => {
  const g = document.createElement('canvas');
  g.width = W;
  g.height = H;
  const gc = g.getContext('2d');
  const tile = document.createElement('canvas');
  tile.width = 256;
  tile.height = 256;
  const tc = tile.getContext('2d');
  const id = tc.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) {
    const v = Math.floor(hash2(i % 256, (i / 256) | 0) * 255);
    id.data[i * 4] = v;
    id.data[i * 4 + 1] = v;
    id.data[i * 4 + 2] = v;
    id.data[i * 4 + 3] = 10;
  }
  tc.putImageData(id, 0, 0);
  for (let x = 0; x < W; x += 256) {
    for (let y = 0; y < H; y += 256) {
      gc.drawImage(tile, x, y);
    }
  }
  return g;
})();

function fitFont(text, maxW, weight, baseSize, family) {
  let sz = baseSize;
  ctx.font = `${weight} ${sz}px '${family}'`;
  const w = ctx.measureText(text).width;
  if (w > maxW && w > 0) {
    sz = Math.max(13, Math.floor(sz * (maxW / w) * 0.985));
    ctx.font = `${weight} ${sz}px '${family}'`;
  }
  return sz;
}

function drawFittedText(text, x, y, maxW, { weight = 800, size = 44, family = 'RussoOne', color = MIL.bone, align = 'left', baseline = 'alphabetic', shadow = true } = {}) {
  ctx.save();
  fitFont(text, maxW, weight, size, family);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  if (shadow) {
    ctx.shadowColor = 'rgba(0,0,0,0.78)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 3;
  }
  ctx.fillText(text, x, y);
  ctx.restore();
}

function roundRectPath(x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawTacticalCard(x, y, w, h, { fill = MIL.panel, stroke = MIL.borderSand, r = 16, accent = MIL.sand, glow = 0 } = {}) {
  ctx.save();
  if (glow > 0) {
    ctx.shadowColor = accent;
    ctx.shadowBlur = glow;
  }
  roundRectPath(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2;
  ctx.strokeStyle = stroke;
  ctx.stroke();

  const L = Math.min(18, w * 0.08, h * 0.25);
  ctx.strokeStyle = accent;
  ctx.lineWidth = 3;
  for (const [cx, cy, sx, sy] of [
    [x + 1, y + 1, 1, 1],
    [x + w - 1, y + 1, -1, 1],
    [x + 1, y + h - 1, 1, -1],
    [x + w - 1, y + h - 1, -1, -1],
  ]) {
    ctx.beginPath();
    ctx.moveTo(cx + sx * L, cy);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx, cy + sy * L);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCoverImage(im, x, y, w, h, { zoom = 1.0, panX = 0, panY = 0, alpha = 1.0, radius = 0 } = {}) {
  const ir = im.width / im.height;
  const br = w / h;
  let dw, dh;
  if (ir > br) {
    dh = h * zoom;
    dw = dh * ir;
  } else {
    dw = w * zoom;
    dh = dw / ir;
  }
  const dx = x + (w - dw) * 0.5 + panX;
  const dy = y + (h - dh) * 0.5 + panY;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (radius > 0) roundRectPath(x, y, w, h, radius);
  else { ctx.beginPath(); ctx.rect(x, y, w, h); }
  ctx.clip();
  ctx.drawImage(im, dx, dy, dw, dh);
  ctx.restore();
}

function drawContainImage(im, cx, cy, maxW, maxH, { scale = 1.0, alpha = 1.0, glowColor = null, glowBlur = 0, dropShadow = true } = {}) {
  const s = Math.min(maxW / im.width, maxH / im.height) * scale;
  const dw = im.width * s;
  const dh = im.height * s;
  const dx = cx - dw * 0.5;
  const dy = cy - dh * 0.5;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (glowColor && glowBlur > 0) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = glowBlur;
    ctx.drawImage(im, dx, dy, dw, dh);
  }
  if (dropShadow) {
    ctx.shadowColor = 'rgba(0, 0, 0, 0.82)';
    ctx.shadowBlur = 34;
    ctx.shadowOffsetY = 16;
  }
  ctx.drawImage(im, dx, dy, dw, dh);
  ctx.restore();
  return { x: dx, y: dy, w: dw, h: dh };
}

function drawSceneBackdrop(bgImg, t, scIdx, { tint = 'rgba(9, 13, 8, 0.77)', goldRadial = 0.18, beatPulse = 0 } = {}) {
  const sStart = CUTS[scIdx];
  const sDur = CUTS[scIdx + 1] - sStart;
  const u = clamp((t - sStart) / sDur, 0, 1);

  ctx.fillStyle = MIL.bg;
  ctx.fillRect(0, 0, W, H);

  drawCoverImage(bgImg, 0, 0, W, H, {
    zoom: 1.06 + u * 0.055,
    panX: lerp(-16, 16, u) * (scIdx % 2 === 0 ? 1 : -1),
    panY: lerp(-10, 10, u),
    alpha: 0.44,
  });

  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.strokeStyle = 'rgba(213, 174, 92, 0.065)';
  ctx.lineWidth = 1;
  for (let gx = 60; gx < W; gx += 120) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }
  for (let gy = 80; gy < H; gy += 120) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }
  ctx.restore();

  const rg = ctx.createRadialGradient(W * 0.52, H * 0.48, 30, W * 0.52, H * 0.48, 790);
  rg.addColorStop(0, `rgba(246, 216, 140, ${(goldRadial + beatPulse * 0.075).toFixed(3)})`);
  rg.addColorStop(0.55, 'rgba(38, 54, 28, 0.10)');
  rg.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  const vig = ctx.createRadialGradient(W * 0.5, H * 0.5, 420, W * 0.5, H * 0.5, 1140);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(4, 6, 4, 0.74)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function drawTopHUD(t, scIdx, sectionTag) {
  const y = 52;
  drawTacticalCard(PAD, y, SAFE_W, 92, {
    fill: 'rgba(14, 20, 12, 0.93)',
    stroke: 'rgba(213, 174, 92, 0.52)',
    r: 14,
    accent: MIL.sandHi,
  });

  drawContainImage(IMG.logoShieldSand, PAD + 48, y + 46, 66, 68, { dropShadow: false });

  drawFittedText('В ОКОПЕ · КОНТРОЛЬ НЕБА', PAD + 94, y + 42, 470, {
    weight: 900, size: 26, family: 'RussoOne', color: MIL.sandHi, shadow: false,
  });
  drawFittedText(sectionTag, PAD + 94, y + 73, 560, {
    weight: 700, size: 19, family: 'JetMono', color: MIL.emerald, shadow: false,
  });

  const pillW = 248;
  const px = PAD + SAFE_W - pillW - 18;
  roundRectPath(px, y + 20, pillW, 52, 10);
  ctx.fillStyle = 'rgba(246, 179, 71, 0.15)';
  ctx.fill();
  ctx.strokeStyle = MIL.sandHi;
  ctx.lineWidth = 2;
  ctx.stroke();

  const blink = 0.55 + 0.45 * Math.sin(t * 7.5);
  ctx.save();
  ctx.globalAlpha = blink;
  ctx.fillStyle = MIL.emerald;
  ctx.beginPath();
  ctx.arc(px + 24, y + 46, 6.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  drawFittedText(`SCAN 360° · 0${scIdx + 1}/06`, px + 42, y + 53, pillW - 56, {
    weight: 800, size: 19, family: 'JetMono', color: MIL.bone, shadow: false,
  });
}

function drawProgressBar(t) {
  const y = 1866;
  ctx.fillStyle = 'rgba(255,255,255,0.11)';
  roundRectPath(PAD, y, SAFE_W, 8, 4);
  ctx.fill();
  const fw = Math.max(8, SAFE_W * clamp(t / DURATION, 0, 1));
  const grd = ctx.createLinearGradient(PAD, 0, PAD + SAFE_W, 0);
  grd.addColorStop(0, MIL.sandHi);
  grd.addColorStop(1, MIL.emerald);
  ctx.fillStyle = grd;
  roundRectPath(PAD, y, fw, 8, 4);
  ctx.fill();
}

// =========================================================================
// SCENE 1 [0.00s .. 9.32s]: HERO HOOK — АЛДАН-12 + ЧАСЫ В ПОДАРОК!
// =========================================================================
function renderScene1(t, beatPulse) {
  const lt = t - CUTS[0];
  drawSceneBackdrop(IMG.bgRadar, t, 0, { goldRadial: 0.22, beatPulse });
  drawTopHUD(t, 0, 'ДРОН-ДЕТЕКТОР БПЛА · 100 МГц – 13 ГГц');

  const eHead = easeOutCubic(prog(lt, 0.05, 0.42));
  ctx.save();
  ctx.globalAlpha = eHead;
  drawFittedText('«АЛДАН-12»', PAD, 250 - (1 - eHead) * 18, SAFE_W, {
    weight: 900, size: 92, family: 'RussoOne', color: MIL.bone,
  });
  drawFittedText('ДРОН-ДЕТЕКТОР БПЛА · 100 МГц – 13 ГГц', PAD, 332, SAFE_W, {
    weight: 900, size: 46, family: 'FiraCond', color: MIL.sandHi,
  });
  ctx.restore();

  // Animated 360° radar sweep behind hero trio
  const rcx = 760, rcy = 960;
  for (let r = 1; r <= 3; r++) {
    ctx.save();
    ctx.strokeStyle = `rgba(74, 232, 138, ${(0.28 - r * 0.06).toFixed(2)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(rcx, rcy, r * 112, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  const sweepAng = (t * 2.4) % (Math.PI * 2);
  ctx.save();
  ctx.strokeStyle = 'rgba(74, 232, 138, 0.65)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(rcx, rcy);
  ctx.lineTo(rcx + Math.cos(sweepAng) * 336, rcy + Math.sin(sweepAng) * 336);
  ctx.stroke();
  ctx.restore();

  // Left stack of 4 power cards (including big GIFT WATCH highlight!)
  const cards = [
    { k: 'АКЦИЯ В «В ОКОПЕ»', v: '+ ЧАСЫ В ПОДАРОК!', s: 'Выносной браслет оповещения в комплекте', acc: MIL.amber, hi: true },
    { k: 'ШИРОКИЙ ДИАПАЗОН', v: '100 – 13 000 МГц', s: 'Перекрывает все основные частоты БПЛА', acc: MIL.sandHi },
    { k: 'ДИСТАНЦИЯ И ОХВАТ', v: '1000 М · 360°', s: 'До 9 дронов одновременно · 13 зон', acc: MIL.emerald },
    { k: 'УМНЫЙ ФИЛЬТР ЭФИРА', v: '425–445 МГц', s: 'Свои рации ложную тревогу не вызывают', acc: MIL.cyan },
  ];

  cards.forEach((c, idx) => {
    const eb = easeOutBack(prog(lt, 0.24 + idx * 0.16, 0.44));
    const cy = 384 + idx * 246;
    ctx.save();
    ctx.globalAlpha = clamp(eb, 0, 1);
    ctx.translate(-(1 - eb) * 36, 0);
    drawTacticalCard(PAD, cy, 456, 224, {
      fill: c.hi ? MIL.panelAmber : MIL.panelHi,
      stroke: c.hi ? 'rgba(246, 179, 71, 0.80)' : 'rgba(213, 174, 92, 0.50)',
      r: 16,
      accent: c.acc,
      glow: c.hi ? 16 + beatPulse * 14 : 0,
    });
    drawFittedText(c.k, PAD + 24, cy + 46, 408, {
      weight: 800, size: 19, family: 'JetMono', color: c.acc, shadow: false,
    });
    drawFittedText(c.v, PAD + 24, cy + 124, 408, {
      weight: 900, size: 52, family: 'FiraCond', color: MIL.bone, shadow: false,
    });
    drawFittedText(c.s, PAD + 24, cy + 180, 408, {
      weight: 700, size: 22, family: 'RobotoBold', color: MIL.ash, shadow: false,
    });
    ctx.restore();
  });

  // Hero full trio cutout on right (Gift Watch + 3-Antenna Aldan-12 + 2nd 5400 mAh Battery!)
  const eHero = easeOutBack(prog(lt, 0.12, 0.56));
  drawContainImage(IMG.trio, 780, 885 + Math.sin(t * 2.1) * 6, 495, 1020, {
    scale: (0.90 + 0.10 * eHero) * (1 + beatPulse * 0.016),
    alpha: clamp(eHero, 0, 1),
    glowColor: 'rgba(246, 216, 140, 0.42)',
    glowBlur: 32 + beatPulse * 16,
  });

  // Bottom bar
  drawTacticalCard(PAD, 1412, SAFE_W, 412, {
    fill: 'rgba(13, 21, 14, 0.95)',
    stroke: MIL.borderSand,
    r: 18,
    accent: MIL.sandHi,
  });
  drawContainImage(IMG.watch, 845, 1618, 280, 320, {
    scale: 1 + beatPulse * 0.02,
    glowColor: 'rgba(246, 179, 71, 0.44)',
    glowBlur: 26,
  });
  drawFittedText('ДЕТЕКТОР + ЧАСЫ В ПОДАРОК', PAD + 28, 1498, 620, {
    weight: 900, size: 46, family: 'FiraCond', color: MIL.amber, shadow: false,
  });
  drawFittedText('ДО 15 ЧАСОВ · 2 АКБ 5400 мА·ч', PAD + 28, 1572, 620, {
    weight: 900, size: 44, family: 'RussoOne', color: MIL.bone, shadow: false,
  });
  drawFittedText('ДЕКЛАРАЦИЯ ЕАЭС ДО 2030 Г. · РУССКИЙ ЯЗЫК', PAD + 28, 1644, 620, {
    weight: 800, size: 22, family: 'JetMono', color: MIL.emerald, shadow: false,
  });
  drawFittedText('Видит DJI · FPV · AUTEL и цифровые каналы', PAD + 28, 1712, 620, {
    weight: 700, size: 25, family: 'RobotoBold', color: MIL.ash, shadow: false,
  });
  drawFittedText('ОПТОМ И В РОЗНИЦУ · С НДС И БЕЗ НДС', PAD + 28, 1776, 620, {
    weight: 800, size: 22, family: 'JetMono', color: MIL.sandHi, shadow: false,
  });

  drawProgressBar(t);
}

// =========================================================================
// SCENE 2 [9.32s .. 19.25s]: 360° RADAR · 1000 M · 9 UAVs · 13 SUB-BANDS
// =========================================================================
function renderScene2(t, beatPulse) {
  const lt = t - CUTS[1];
  drawSceneBackdrop(IMG.bgRadar, t, 1, { goldRadial: 0.20, beatPulse });
  drawTopHUD(t, 1, 'КРУГОВОЕ СКАНИРОВАНИЕ 360° · ДО 9 ЦЕЛЕЙ');

  drawFittedText('360° И ДО 1000 МЕТРОВ', PAD, 236, SAFE_W, {
    weight: 900, size: 68, family: 'RussoOne', color: MIL.bone,
  });
  drawFittedText('ДО 9 БПЛА ОДНОВРЕМЕННО В 13 НАСТРАИВАЕМЫХ ЗОНАХ', PAD, 308, SAFE_W, {
    weight: 900, size: 40, family: 'FiraCond', color: MIL.emerald,
  });

  // Live tactical 360° radar scope plotting 9 simultaneous UAV targets + upright Aldan-12 hero
  drawTacticalCard(PAD, 348, 596, 616, {
    fill: 'rgba(9, 19, 13, 0.95)',
    stroke: MIL.borderEmerald,
    r: 20,
    accent: MIL.emerald,

  drawFittedText('ОПТОМ И В РОЗНИЦУ · С НДС И БЕЗ НДС · ДЕКЛАРАЦИЯ ЕАЭС ДО 2030 Г.', W * 0.5, 1778, SAFE_W - 60, {
    weight: 700, size: 21, family: 'JetMono', color: MIL.bone, align: 'center', shadow: false,
  });
}

// =========================================================================
// STATELESS MASTER FRAME DISPATCHER (100% BIT-EXACT DETERMINISTIC)
// =========================================================================
function renderFrame(rawTime) {
  const t = clamp(rawTime, 0, DURATION - 1e-4);
  const beatPhase = (t / BEAT) % 1;
  const beatPulse = Math.exp(-beatPhase * 5.2);

  let scIdx = 0;
  for (let i = 0; i < 6; i++) {
    if (t >= CUTS[i] && t < CUTS[i + 1]) {
      scIdx = i;
      break;
    }
  }
  if (t >= CUTS[6] - 1e-3) scIdx = 5;

  switch (scIdx) {
    case 0: renderScene1(t, beatPulse); break;
    case 1: renderScene2(t, beatPulse); break;
    case 2: renderScene3(t, beatPulse); break;
    case 3: renderScene4(t, beatPulse); break;
    case 4: renderScene5(t, beatPulse); break;
    default: renderScene6(t, beatPulse); break;
  }

  if (scIdx > 0) {
    const dtCut = t - CUTS[scIdx];
    if (dtCut >= 0 && dtCut < 0.14) {
      const fa = (1 - dtCut / 0.14) * 0.22;
      ctx.fillStyle = `rgba(246, 232, 198, ${fa.toFixed(4)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  ctx.drawImage(GRAIN_FULL, 0, 0);
}

window.renderAt = renderFrame;
window.getFrameSignature = function () {
  const d = ctx.getImageData(0, 0, W, H).data;
  let h = 2166136261;
  for (let i = 0; i < d.length; i += 97) {
    h ^= d[i];
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
};

window.__READY_PROMISE = loadAllAssets().then(() => {
  renderFrame(0);
  return true;
});
