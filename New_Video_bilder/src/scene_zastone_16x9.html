function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function easeOut(v) { const t = clamp01(v); return 1 - Math.pow(1 - t, 3); }

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function drawPanel(x, y, w, h, variant = "default", r = 20) {
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.5)";
  ctx.shadowBlur = 26;
  ctx.shadowOffsetY = 10;
  let fill = COL.panel;
  let stroke = COL.border;
  if (variant === "green") {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, "rgba(20, 48, 28, 0.94)");
    g.addColorStop(1, "rgba(11, 22, 14, 0.95)");
    fill = g; stroke = "rgba(91, 227, 138, 0.62)";
  } else if (variant === "gold") {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, "rgba(48, 38, 17, 0.94)");
    g.addColorStop(1, "rgba(20, 17, 10, 0.95)");
    fill = g; stroke = "rgba(246, 216, 140, 0.65)";
  } else if (variant === "red") {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, "rgba(56, 18, 18, 0.93)");
    g.addColorStop(1, "rgba(24, 10, 10, 0.94)");
    fill = g; stroke = "rgba(255, 100, 100, 0.60)";
  } else if (variant === "cyan") {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, "rgba(16, 38, 52, 0.93)");
    g.addColorStop(1, "rgba(10, 20, 28, 0.95)");
    fill = g; stroke = "rgba(89, 200, 255, 0.58)";
  }
  rr(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.lineWidth = 2;
  ctx.strokeStyle = stroke;
  ctx.stroke();
  ctx.restore();
}

function fitFont(text, weight, maxPx, minPx, maxW, fam = "Liberation Sans, DejaVu Sans, Arial, sans-serif") {
  let sz = maxPx;
  while (sz > minPx) {
    ctx.font = `${weight} ${sz}px ${fam}`;
    if (ctx.measureText(text).width <= maxW) break;
    sz -= 1;
  }
  ctx.font = `${weight} ${sz}px ${fam}`;
  return sz;
}

function drawFitText(text, x, y, maxW, maxPx, weight = 900, color = "#fff", align = "left", minPx = 14) {
  fitFont(text, weight, maxPx, minPx, maxW);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = "alphabetic";
  ctx.fillText(text, x, y);
  ctx.textAlign = "left";
}

function drawWrapped(text, x, y, maxW, lineH, fontSpec, color = "#d8e1d6", maxLines = 4) {
  ctx.font = fontSpec;
  ctx.fillStyle = color;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  const words = text.split(" ");
  let line = "";
  let lineIdx = 0;
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + " " + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y + lineIdx * lineH);
      line = words[i];
      lineIdx++;
      if (lineIdx >= maxLines - 1) {
        while (i + 1 < words.length) {
          i++;
          line += " " + words[i];
        }
        while (ctx.measureText(line).width > maxW && line.length > 6) {
          line = line.slice(0, -2) + "…";
        }
        break;
      }
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, y + lineIdx * lineH);
  return y + (lineIdx + 1) * lineH;
}

function drawKicker(text, x, y, maxW = 920) {
  ctx.font = "800 18px Liberation Sans, DejaVu Sans, sans-serif";
  const tw = Math.min(maxW, ctx.measureText(text).width + 38);
  rr(x, y, tw, 38, 9);
  ctx.fillStyle = "rgba(216, 178, 99, 0.16)";
  ctx.fill();
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = "rgba(246, 216, 140, 0.58)";
  ctx.stroke();
  // Diamond icon
  ctx.fillStyle = COL.goldBright;
  ctx.beginPath();
  ctx.moveTo(x + 17, y + 12);
  ctx.lineTo(x + 24, y + 19);
  ctx.lineTo(x + 17, y + 26);
  ctx.lineTo(x + 10, y + 19);
  ctx.closePath();
  ctx.fill();
  drawFitText(text, x + 32, y + 25, tw - 42, 17, 800, COL.goldBright);
}

function drawContain(img, x, y, w, h, scaleMul = 1.0, floatY = 0) {
  if (!img) return;
  const sc = Math.min(w / img.width, h / img.height) * scaleMul;
  const dw = img.width * sc;
  const dh = img.height * sc;
  const dx = x + (w - dw) / 2;
  const dy = y + (h - dh) / 2 + floatY;
  ctx.save();
  ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
  ctx.shadowBlur = 34;
  ctx.shadowOffsetY = 18;
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
}

function drawBackground(t, beatPulse, actIdx = 0) {
  ctx.fillStyle = "#060906";
  ctx.fillRect(0, 0, W, H);

  // Subtle atmospheric military backdrop (14% opacity + slow Ken Burns pan)
  const bgImg = (actIdx % 2 === 0) ? IMG.bgRadar : IMG.bgCrates;
  if (bgImg) {
    ctx.save();
    ctx.globalAlpha = 0.16;
    const zoom = 1.05 + 0.03 * Math.sin(t * 0.12);
    const dw = W * zoom, dh = H * zoom;
    ctx.drawImage(bgImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
    ctx.restore();
  }

  const g = ctx.createRadialGradient(560, 520, 60, 960, 540, 1280);
  g.addColorStop(0, `rgba(24, 42, 26, ${0.62 + 0.08 * beatPulse})`);
  g.addColorStop(0.62, "rgba(9, 14, 10, 0.86)");
  g.addColorStop(1, "rgba(5, 8, 5, 0.95)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Moving subtle tactical coordinate grid
  ctx.strokeStyle = "rgba(130, 180, 130, 0.05)";
  ctx.lineWidth = 1;
  const off = (t * 22) % 80;
  for (let x = 0; x <= W; x += 80) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = -80; y <= H; y += 80) {
    ctx.beginPath(); ctx.moveTo(0, y + off); ctx.lineTo(W, y + off); ctx.stroke();
  }

  // Subtle radar rings on left hero side
  ctx.save();
  ctx.translate(410, 560);
  for (let r = 140; r <= 420; r += 140) {
    ctx.strokeStyle = `rgba(91, 227, 138, ${0.045 + 0.025 * beatPulse})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  }
  const ang = t * 0.9;
  const sg = ctx.createLinearGradient(0, 0, Math.cos(ang) * 410, Math.sin(ang) * 410);
  sg.addColorStop(0, "rgba(91, 227, 138, 0)");
  sg.addColorStop(1, "rgba(91, 227, 138, 0.14)");
  ctx.strokeStyle = sg;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ang) * 410, Math.sin(ang) * 410); ctx.stroke();
  ctx.restore();
}

const ACT_FNS = [act01, act02, act03, act04, act05, act06, act07, act08, act09, act10, act11];

window.renderAt = function(t) {
  const beatPhase = (t / BEAT) % 1.0;
  const beatPulse = Math.exp(-4.2 * beatPhase);

  let cur = SCENES[SCENES.length - 1];
  for (let i = 0; i < SCENES.length; i++) {
    if (t >= SCENES[i].start && t < SCENES[i].end) {
      cur = SCENES[i];
      break;
    }
  }
  drawBackground(t, beatPulse, cur.idx);

  const lt = t - cur.start;
  const enter = easeOut(lt / 0.30);
  const exitAlpha = cur.idx < SCENES.length - 1 ? clamp01((cur.end - t) / 0.16) : 1.0;

  ctx.save();
  ctx.globalAlpha = enter * exitAlpha;
  ctx.translate(0, (1 - enter) * 20);
  ACT_FNS[cur.idx](t, lt, beatPulse);
  ctx.restore();

  // Subtle chapter transition flash
  for (let i = 1; i < SCENES.length; i++) {
    const dt = Math.abs(t - SCENES[i].start);
    if (dt < 0.20) {
      const a = (1 - dt / 0.20) * 0.22;
      ctx.fillStyle = `rgba(246, 216, 140, ${a.toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  drawPersistentHUD(t, cur);
};

window.setVideoTime = window.renderAt;
window.getFrameSignature = function() {
  const d = ctx.getImageData(480, 270, 32, 32).data;
  let h = 2166136261;
  for (let i = 0; i < d.length; i += 4) {
    h ^= d[i] + (d[i + 1] << 8) + (d[i + 2] << 16);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h.toString(16);
};
