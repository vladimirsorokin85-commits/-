<script type="module">
const W = 1080;
const H = 1920;
const DURATION = 30.0;
const BPM = 174.0;
const BEAT = 60.0 / BPM;

// Tactical Military Palette ("В ОКОПЕ — МАГАЗИН БРОНИ")
const MIL = {
  bgDark: '#0c1009',
  plateFill: 'rgba(18, 23, 14, 0.94)',
  plateFill2: 'rgba(25, 32, 19, 0.95)',
  oliveActive: 'rgba(54, 71, 35, 0.95)',
  sand: '#d5ae5c',       // Coyote / Brass Stencil Gold
  sandBright: '#e7c475',
  olive: '#849e54',      // Russian Field Olive
  phosphor: '#8fd158',   // Night-Vision / Radar Phosphor
  rustRed: '#d1492f',    // Threat Spike / Stamp Alert
  bone: '#f2efe4',       // Stencil Bone-White
  ash: '#c5c7ba',        // Secondary Technical Stencil
  muted: '#8f9683',
  borderSand: 'rgba(213, 174, 92, 0.52)',
  borderOlive: 'rgba(132, 158, 84, 0.48)',
};

// Exact measured audio sync landmarks from src/audio_sync_map.json
const SYNC = {
  cuts: [0.0, 4.65, 14.30, 19.70, 24.333333, 30.0],
  s1Lock: 0.4565,
  s1Drop: 1.4646,
  s2Nodes: [5.422, 8.896, 11.791],
  s3Checks: [15.488, 17.000, 18.404],
  s4Drop: 19.7565,
  s5Slam: 24.371,
  s5Sting: 28.390,
};

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a || 1e-6), 0, 1);
const smoothstep = (e0, e1, x) => {
  const t = invLerp(e0, e1, x);
  return t * t * (3 - 2 * t);
};
const easeOutExpo = (x) => {
  const t = clamp(x, 0, 1);
  return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
};
const easeOutBack = (x, s = 1.28) => {
  const t = clamp(x, 0, 1) - 1;
  return t * t * ((s + 1) * t + s) + 1;
};
const easeInOutCubic = (x) => {
  const t = clamp(x, 0, 1);
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
};
const hash11 = (p) => {
  const s = Math.sin(p * 127.1 + 311.7) * 43758.5453123;
  return s - Math.floor(s);
};
const vnoise = (x) => {
  const i = Math.floor(x);
  const f = x - i;
  const u = f * f * (3 - 2 * f);
  return lerp(hash11(i), hash11(i + 1), u);
};

// SAPI Ballistic Armor Plate 45-degree Chamfered Path (replaces rounded SaaS boxes!)
function armorPlatePath(g, x, y, w, h, cut = 22) {
  const c = Math.min(cut, w * 0.25, h * 0.35);
  g.beginPath();
  g.moveTo(x + c, y);
  g.lineTo(x + w - c, y);
  g.lineTo(x + w, y + c);
  g.lineTo(x + w, y + h - c);
  g.lineTo(x + w - c, y + h);
  g.lineTo(x + c, y + h);
  g.lineTo(x, y + h - c);
  g.lineTo(x, y + c);
  g.closePath();
}

function drawArmorPlate(g, x, y, w, h, opts = {}) {
  const {
    cut = 22,
    fill = MIL.plateFill,
    stroke = MIL.borderSand,
    lineW = 2.0,
    rivets = true,
    hazardTopRight = false,
    accentBarLeft = null,
  } = opts;

  g.save();
  armorPlatePath(g, x, y, w, h, cut);
  g.fillStyle = fill;
  g.fill();
  g.lineWidth = lineW;
  g.strokeStyle = stroke;
  g.stroke();

  if (accentBarLeft) {
    g.fillStyle = accentBarLeft;
    g.fillRect(x + 2, y + cut + 6, 6, h - (cut + 6) * 2);
  }

  // Diagonal military stencil hazard stripes in top-right corner
  if (hazardTopRight) {
    g.save();
    armorPlatePath(g, x, y, w, h, cut);
    g.clip();
    g.fillStyle = 'rgba(213, 174, 92, 0.16)';
    for (let i = 0; i < 6; i++) {
      const sx = x + w - 165 + i * 26;
      g.beginPath();
      g.moveTo(sx, y);
      g.lineTo(sx + 13, y);
      g.lineTo(sx - 15, y + 36);
      g.lineTo(sx - 28, y + 36);
      g.closePath();
      g.fill();
    }
    g.restore();
  }

  // 4 Tactical Hex Bolt Corner Rivets
  if (rivets) {
    const off = Math.max(14, cut * 0.68);
    const pts = [
      [x + off, y + off],
      [x + w - off, y + off],
      [x + off, y + h - off],
      [x + w - off, y + h - off],
    ];
    g.fillStyle = 'rgba(213, 174, 92, 0.45)';
    for (const [rx, ry] of pts) {
      g.beginPath();
      g.arc(rx, ry, 3.2, 0, Math.PI * 2);
      g.fill();
    }
  }
  g.restore();
}

// Pre-baked Russian ЕМР (Digital Flora) Camo + Scratched Steel Micro-Overlay Tile
function buildCamoOverlayCanvas() {
  const c = document.createElement('canvas');
  c.width = 270;
  c.height = 270;
  const g = c.getContext('2d');
  const px = 6;
  for (let y = 0; y < c.height; y += px) {
    for (let x = 0; x < c.width; x += px) {
      const n = vnoise(x * 0.055 + y * 0.017) * 0.65 + vnoise(y * 0.075 - x * 0.02) * 0.35;
      if (n > 0.62) g.fillStyle = 'rgba(72, 92, 46, 0.16)';
      else if (n > 0.44) g.fillStyle = 'rgba(38, 49, 27, 0.14)';
      else g.fillStyle = 'rgba(12, 16, 9, 0.06)';
      g.fillRect(x, y, px, px);
    }
  }
  // Fine brushed steel scratches
  g.strokeStyle = 'rgba(213, 174, 92, 0.045)';
  g.lineWidth = 1;
  for (let i = 0; i < 18; i++) {
    const sy = hash11(i * 19.3) * c.height;
    g.beginPath();
    g.moveTo(0, sy);
    g.lineTo(c.width, sy + (hash11(i * 3.7) - 0.5) * 8);
    g.stroke();
  }
  return c;
}
const CAMO_TILE = buildCamoOverlayCanvas();

// Pure stateless 3D perspective engine in Olive / Brass / Phosphor military range colors
function makeCamera3D(pos, target, fovDeg = 46, roll = 0) {
  let fx = target[0] - pos[0];
  let fy = target[1] - pos[1];
  let fz = target[2] - pos[2];
  const fl = Math.hypot(fx, fy, fz) || 1;
  fx /= fl; fy /= fl; fz /= fl;

  let rx = -fz, ry = 0, rz = fx;
  const rl = Math.hypot(rx, ry, rz) || 1;
  rx /= rl; ry /= rl; rz /= rl;

  let ux = ry * fz - rz * fy;
  let uy = rz * fx - rx * fz;
  let uz = rx * fy - ry * fx;

  if (roll !== 0) {
    const cr = Math.cos(roll), sr = Math.sin(roll);
    const nrx = rx * cr + ux * sr, nry = ry * cr + uy * sr, nrz = rz * cr + uz * sr;
    const nux = ux * cr - rx * sr, nuy = uy * cr - ry * sr, nuz = uz * cr - rz * sr;
    rx = nrx; ry = nry; rz = nrz;
    ux = nux; uy = nuy; uz = nuz;
  }
  const focal = (H * 0.5) / Math.tan((fovDeg * Math.PI) / 360);
  return { pos, fx, fy, fz, rx, ry, rz, ux, uy, uz, focal };
}

function project3D(cam, x, y, z) {
  const dx = x - cam.pos[0];
  const dy = y - cam.pos[1];
  const dz = z - cam.pos[2];
  const cz = dx * cam.fx + dy * cam.fy + dz * cam.fz;
  if (cz <= 0.15) return null;
  const cx = dx * cam.rx + dy * cam.ry + dz * cam.rz;
  const cy = dx * cam.ux + dy * cam.uy + dz * cam.uz;
  const s = cam.focal / cz;
  return { x: W * 0.5 + cx * s, y: H * 0.5 - cy * s, z: cz, s };
}

function drawLine3D(g, cam, p1, p2) {
  const a = project3D(cam, p1[0], p1[1], p1[2]);
  const b = project3D(cam, p2[0], p2[1], p2[2]);
  if (!a || !b) return;
  g.beginPath();
  g.moveTo(a.x, a.y);
  g.lineTo(b.x, b.y);
  g.stroke();
}

const EMBER_PTS = Array.from({ length: 165 }, (_, i) => ({
  x: (hash11(i * 3.1) - 0.5) * 18,
  y: (hash11(i * 7.7) - 0.35) * 14,
  z: -hash11(i * 11.3) * 24 + 4,
  r: 1.3 + hash11(i * 5.9) * 2.5,
  warm: hash11(i * 2.3) > 0.35,
}));

function draw3DTacticalField(g, cam, opts = {}) {
  const {
    gridY = -2.4,
    gridOpacity = 0.24,
    showDome = false,
    domePos = [0, -0.35, 0],
    domeRadius = 2.85,
    domeRot = 0,
    domeColor = 'rgba(143, 209, 88, 0.28)',
    ringColorA = 'rgba(213, 174, 92, 0.38)',
    ringColorB = 'rgba(132, 158, 84, 0.34)',
    showBus = false,
    pedestalActiveIdx = -1,
    dustRot = 0,
    dustZOffset = 0,
    dustAlpha = 0.50,
  } = opts;

  g.save();

  // Artillery Azimuth Range Grid (Olive & Brass — ZERO neon blue!)
  if (gridOpacity > 0.01) {
    g.lineWidth = 1.25;
    for (let gx = -12; gx <= 12; gx += 1.5) {
      g.strokeStyle =
        gx === 0
          ? `rgba(213, 174, 92, ${(gridOpacity * 1.45).toFixed(3)})`
          : `rgba(98, 120, 62, ${gridOpacity.toFixed(3)})`;
      drawLine3D(g, cam, [gx, gridY, 6], [gx, gridY, -24]);
    }
    for (let gz = 6; gz >= -24; gz -= 1.5) {
      g.strokeStyle = `rgba(98, 120, 62, ${(gridOpacity * 0.8).toFixed(3)})`;
      drawLine3D(g, cam, [-12, gridY, gz], [12, gridY, gz]);
    }
  }

  // 3D EW Protective Dome
  if (showDome) {
    const [dx0, dy0, dz0] = domePos;
    g.strokeStyle = domeColor;
    g.lineWidth = 1.6;
    for (let li = 1; li <= 5; li++) {
      const phi = (li / 5.5) * (Math.PI * 0.5);
      const ry = Math.cos(phi) * domeRadius;
      const rr = Math.sin(phi) * domeRadius;
      let prev = null;
      g.beginPath();
      for (let s = 0; s <= 28; s++) {
        const th = domeRot + (s / 28) * Math.PI * 2;
        const p = project3D(cam, dx0 + Math.cos(th) * rr, dy0 + ry, dz0 + Math.sin(th) * rr);
        if (p) {
          if (!prev) g.moveTo(p.x, p.y);
          else g.lineTo(p.x, p.y);
        }
        prev = p;
      }
      g.stroke();
    }
    for (let mi = 0; mi < 12; mi++) {
      const th = domeRot + (mi / 12) * Math.PI * 2;
      let prev = null;
      g.beginPath();
      for (let s = 0; s <= 12; s++) {
        const phi = (s / 12) * (Math.PI * 0.5);
        const rr = Math.sin(phi) * domeRadius;
        const ry = Math.cos(phi) * domeRadius;
        const p = project3D(cam, dx0 + Math.cos(th) * rr, dy0 + ry, dz0 + Math.sin(th) * rr);
        if (p) {
          if (!prev) g.moveTo(p.x, p.y);
          else g.lineTo(p.x, p.y);
        }
        prev = p;
      }
      g.stroke();
    }
    for (let ri = 0; ri < 3; ri++) {
      const rad = domeRadius * (1.05 + ri * 0.16);
      const tiltX = 1.18 + Math.sin(domeRot * 1.6 + ri) * 0.22;
      const spinY = domeRot * (ri % 2 ? -1.4 : 1.2) + ri;
      g.strokeStyle = ri === 1 ? ringColorB : ringColorA;
      g.lineWidth = 2.0 - ri * 0.3;
      g.beginPath();
      let prev = null;
      for (let s = 0; s <= 40; s++) {
        const a = (s / 40) * Math.PI * 2;
        const lx = Math.cos(a) * rad;
        const ly = Math.sin(a) * rad * Math.cos(tiltX);
        const lz = Math.sin(a) * rad * Math.sin(tiltX);
        const wx = lx * Math.cos(spinY) - lz * Math.sin(spinY);
        const wz = lx * Math.sin(spinY) + lz * Math.cos(spinY);
        const p = project3D(cam, dx0 + wx, dy0 + 0.5 + ly, dz0 + wz);
        if (p) {
          if (!prev) g.moveTo(p.x, p.y);
          else g.lineTo(p.x, p.y);
        }
        prev = p;
      }
      g.stroke();
    }
  }

  // 3D Brass & Olive Range Rails
  if (showBus) {
    g.lineWidth = 3.4;
    g.strokeStyle = 'rgba(213, 174, 92, 0.68)';
    drawLine3D(g, cam, [-1.55, -1.65, 6], [-1.55, -1.65, -20]);
    g.strokeStyle = 'rgba(132, 158, 84, 0.68)';
    drawLine3D(g, cam, [1.55, -1.65, 6], [1.55, -1.65, -20]);

    const pZs = [0.0, -6.5, -13.0];
    const pCols = [MIL.sand, MIL.phosphor, MIL.olive];
    pZs.forEach((pz, idx) => {
      const px0 = idx === 1 ? 0.35 : idx === 2 ? -0.35 : -0.10;
      g.strokeStyle = pCols[idx];
      g.globalAlpha = idx === pedestalActiveIdx ? 0.85 : 0.32;
      g.lineWidth = idx === pedestalActiveIdx ? 3.2 : 1.7;
      for (const ringR of [1.45, 1.62]) {
        g.beginPath();
        let prev = null;
        for (let s = 0; s <= 32; s++) {
          const a = (s / 32) * Math.PI * 2;
          const p = project3D(cam, px0 + Math.cos(a) * ringR, -1.60, pz + Math.sin(a) * ringR);
          if (p) {
            if (!prev) g.moveTo(p.x, p.y);
            else g.lineTo(p.x, p.y);
          }
          prev = p;
        }
        g.stroke();
      }
    });
    g.globalAlpha = 1;
  }

  // Warm Frontline Tungsten Embers & Dust Motes
  if (dustAlpha > 0.01) {
    const cr = Math.cos(dustRot), sr = Math.sin(dustRot);
    for (let i = 0; i < EMBER_PTS.length; i++) {
      const d = EMBER_PTS[i];
      const rx = d.x * cr - d.z * sr;
      const rz = d.x * sr + d.z * cr + dustZOffset;
      const p = project3D(cam, rx, d.y, rz);
      if (!p || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) continue;
      const depthFade = clamp(1.35 - p.z / 22, 0.08, 1);
      const rad = clamp(d.r * (7.5 / p.z), 0.8, 5.0);
      g.fillStyle = d.warm
        ? `rgba(218, 168, 82, ${(dustAlpha * depthFade).toFixed(3)})`
        : `rgba(148, 178, 96, ${(dustAlpha * 0.75 * depthFade).toFixed(3)})`;
      g.beginPath();
      g.arc(p.x, p.y, rad, 0, Math.PI * 2);
      g.fill();
    }
  }
  g.restore();
}

const masterCanvas = document.getElementById('master');
const mctx = masterCanvas.getContext('2d', { alpha: false, willReadFrequently: true });

const frameCanvas = document.createElement('canvas');
frameCanvas.width = W;
frameCanvas.height = H;
const ctx = frameCanvas.getContext('2d', { alpha: false });

const uiCanvas = document.createElement('canvas');
uiCanvas.width = 960;
uiCanvas.height = 1120;
const uctx = uiCanvas.getContext('2d');

const ASSET_PATHS = {
  bgDugout: '/assets/images/bg_trench_dugout_dusk.jpg',
  bgArmor: '/assets/images/bg_armor_plate_camo.jpg',
  bgCrates: '/assets/images/bg_military_crates_olive.jpg',

  fpv: '/assets/real_products/real_br5_plates_rgba.png',
};
const IMGS = {};
const BLUR_IMGS = {};

function createBlurredCopy(img, radiusPx, maxDim = 720) {
  const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
  const cw = Math.max(16, Math.round(img.width * scale));
  const ch = Math.max(16, Math.round(img.height * scale));
  const c = document.createElement('canvas');
  c.width = cw + radiusPx * 4;
  c.height = ch + radiusPx * 4;
  const g = c.getContext('2d');
  g.filter = `blur(${radiusPx}px)`;
  g.drawImage(img, radiusPx * 2, radiusPx * 2, cw, ch);
  return c;
}

const SAFE_PAD = 60;
const SAFE_W = W - SAFE_PAD * 2; // 960px

function setFittedFont(g, text, maxW, maxPx, minPx, family, weight = '900') {
  let size = maxPx;
  while (size > minPx) {
    g.font = `${weight} ${size}px ${family}`;
    if (g.measureText(text).width <= maxW) break;
    size -= 2;
  }
  g.font = `${weight} ${size}px ${family}`;
  return size;
}

function drawCoverImage(g, img, zoom = 1.0, panX = 0, panY = 0, alpha = 1.0) {
  const iw = img.width;
  const ih = img.height;
  const scale = Math.max(W / iw, H / ih) * zoom;
  const dw = iw * scale;
  const dh = ih * scale;
  const dx = (W - dw) * 0.5 + panX;
  const dy = (H - dh) * 0.5 + panY;
  g.save();
  g.globalAlpha = alpha;
  g.drawImage(img, dx, dy, dw, dh);
  // Subtle ЕМР digital pixel weave on top of photo backdrop
  g.globalAlpha = alpha * 0.42;
  const pat = g.createPattern(CAMO_TILE, 'repeat');
  if (pat) {
    g.fillStyle = pat;
    g.fillRect(0, 0, W, H);
  }
  g.restore();
}

function drawLogoAspect(g, img, cx, cy, targetH, alpha = 1.0) {
  const aspect = img.width / img.height;
  const dh = targetH;
  const dw = dh * aspect;
  g.save();
  g.globalAlpha = alpha;
  g.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
  g.restore();
  return { dw, dh };
}

function drawCutout(g, img, blurCanvas, cx, cy, targetH, opts = {}) {
  const {
    alpha = 1,
    rot = 0,
    dof = 0,
    glowColor = null,
    glowAlpha = 0,
    shadowAlpha = 0.72,
  } = opts;
  if (alpha <= 0.005) return null;
  const aspect = img.width / img.height;
  const dh = targetH;
  const dw = dh * aspect;

  g.save();
  g.globalAlpha = alpha;
  g.translate(cx, cy);
  if (rot) g.rotate(rot);

  if (shadowAlpha > 0.01) {
    const sg = g.createRadialGradient(0, dh * 0.47, 4, 0, dh * 0.47, dw * 0.64);
    sg.addColorStop(0, `rgba(0,0,0,${(0.84 * shadowAlpha).toFixed(3)})`);
    sg.addColorStop(0.55, `rgba(0,0,0,${(0.36 * shadowAlpha).toFixed(3)})`);
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    g.save();
    g.scale(1, 0.24);
    g.fillStyle = sg;
    g.beginPath();
    g.arc(0, (dh * 0.47) / 0.24, dw * 0.64, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  if (glowColor && glowAlpha > 0.01) {
    const rg = g.createRadialGradient(0, 0, dw * 0.1, 0, 0, Math.max(dw, dh) * 0.66);
    rg.addColorStop(0, glowColor.replace('ALPHA', (glowAlpha * 0.5).toFixed(3)));
    rg.addColorStop(1, glowColor.replace('ALPHA', '0'));
    g.fillStyle = rg;
    g.fillRect(-dw * 0.75, -dh * 0.75, dw * 1.5, dh * 1.5);
  }

  const sharpWeight = clamp(1 - dof * 0.92, 0.08, 1);
  g.globalAlpha = alpha * sharpWeight;
  g.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  if (dof > 0.04 && blurCanvas) {
    g.globalAlpha = alpha * clamp(dof, 0, 0.95);
    const padRatio = 1.12;
    g.drawImage(blurCanvas, (-dw * padRatio) / 2, (-dh * padRatio) / 2, dw * padRatio, dh * padRatio);
  }
  g.restore();
  return { cx, cy, dw, dh, rot };
}

function drawKineticHeadline(g, lines, baseY, progress, opts = {}) {
  const {
    maxSize = 68,
    family = 'RussoOne',
    align = 'left',
    accentIndex = 1,
    accentColor = MIL.sand,
    subText = null,
    maxW = SAFE_W,
  } = opts;
  const baseX = align === 'center' ? W / 2 : SAFE_PAD;
  let curY = baseY;

  for (let i = 0; i < lines.length; i++) {
    const lp = clamp((progress - i * 0.12) / 0.56, 0, 1);
    if (lp <= 0.005) {
      curY += maxSize * 1.12;
      continue;
    }
    const eased = easeOutExpo(lp);
    const txt = lines[i];
    const sz = setFittedFont(g, txt, maxW, maxSize, 30, family, '900');
    const lineH = sz * 1.15;

    g.save();
    g.beginPath();
    g.rect(0, curY - sz * 1.08, W, lineH * 1.18);
    g.clip();

    const ySlide = (1 - eased) * (sz * 0.95);
    g.globalAlpha = clamp(0.38 + lp * 1.8, 0, 1);
    g.textAlign = align;
    g.textBaseline = 'alphabetic';

    g.fillStyle = 'rgba(0,0,0,0.82)';
    g.fillText(txt, baseX + 4, curY + ySlide + 6);

    g.fillStyle = i === accentIndex ? accentColor : MIL.bone;
    g.fillText(txt, baseX, curY + ySlide);
    g.restore();

    curY += lineH;
  }

  if (subText && progress > 0.22) {
    const sp = easeOutExpo((progress - 0.22) / 0.55);
    g.save();
    g.globalAlpha = sp;
    const sSize = setFittedFont(g, subText, maxW - 28, 28, 20, 'JetMono', '800');
    if (align === 'center') {
      g.textAlign = 'center';
      g.fillStyle = MIL.sand;
      g.fillText(subText, W / 2, curY + 18 + (1 - sp) * 14);
    } else {
      g.fillStyle = MIL.sand;
      g.fillRect(SAFE_PAD, curY + 4, 6, sSize + 10);
      g.textAlign = 'left';
      g.fillStyle = MIL.ash;
      g.fillText(subText, SAFE_PAD + 20, curY + sSize + 4 + (1 - sp) * 12);
    }
    g.restore();
    curY += sSize + 28;
  }
  return curY;
}

function getSceneIndex(tc) {
  const c = SYNC.cuts;
  if (tc < c[1]) return 0;
  if (tc < c[2]) return 1;
  if (tc < c[3]) return 2;
  if (tc < c[4]) return 3;
  return 4;
}

  // Chamfered Field Spectrum Analyzer Module

    const threatSpike = Math.exp(-(dist * dist) / 7.5) * (1 - 0.72 * postLock) * (0.65 + 0.35 * smoothstep(0.0, 0.18, t));
    const shieldDome = postLock * 0.36 * Math.exp(-Math.pow((i - 28) / 22, 2));
    const amp = clamp(baseNoise + threatSpike + shieldDome, 0.08, 1.0);
    const bh = amp * 162;
    const bx = wx + 32 + i * bw;
    const by = wy + wh - 54 - bh;
    g.fillStyle =
      threatSpike > 0.34 && postLock < 0.55

  g.fillStyle = postLock > 0.5 ? MIL.phosphor : MIL.sand;

  // Military Crosshair Reticle (⊕)
  const targetX = wx + 32 + spikeCenter * bw;
  const retX = lerp(wx + 240, targetX, easeOutExpo(lockP));
  const retY = wy + 134;
  const retR = lerp(58, 28, easeOutExpo(lockP));
  g.strokeStyle = postLock > 0.5 ? MIL.phosphor : MIL.rustRed;
  g.lineWidth = 2.6;
  g.beginPath();
  g.arc(retX, retY, retR, 0, Math.PI * 2);
  g.moveTo(retX - retR - 10, retY);
  g.lineTo(retX - retR + 8, retY);
  g.moveTo(retX + retR - 8, retY);
  g.lineTo(retX + retR + 10, retY);
  g.moveTo(retX, retY - retR - 10);
  g.lineTo(retX, retY - retR + 8);
  g.moveTo(retX, retY + retR - 8);

  if (t >= SYNC.s1Lock && t < SYNC.s1Lock + 0.65) {

    g.strokeStyle = `rgba(213, 174, 92, ${(0.82 * (1 - sp)).toFixed(3)})`;

    g.restore();

  // Hero Armored Olive EW Dome ("КАПЮШОН")
  const heroIn = easeOutBack(clamp(0.45 + t / 0.55, 0, 1), 1.12);

function drawDetectorLiveScreen(g, box, t) {
  if (!box) return;
  const sw = box.dw * 0.56;
  const sh = box.dh * 0.42;
  const sx = box.cx - sw * 0.5;
  const sy = box.cy - box.dh * 0.048;

  g.save();
  g.beginPath();
  g.rect(sx, sy, sw, sh);
  g.clip();
  g.fillStyle = '#0c160a';
  g.fillRect(sx, sy, sw, sh);

  const rcx = sx + sw / 2;
  const rcy = sy + sh * 0.46;
  const rr = Math.min(sw, sh) * 0.34;
  g.strokeStyle = 'rgba(143, 209, 88, 0.42)';
  g.lineWidth = 1.5;
  for (let k = 1; k <= 3; k++) {
    g.beginPath();
    g.arc(rcx, rcy, (rr * k) / 3, 0, Math.PI * 2);
    g.stroke();
  }
  const ang = t * 4.2;
  const coneGrad = g.createRadialGradient(rcx, rcy, 2, rcx, rcy, rr);
  coneGrad.addColorStop(0, 'rgba(143, 209, 88, 0.58)');
  coneGrad.addColorStop(1, 'rgba(143, 209, 88, 0.04)');
  g.fillStyle = coneGrad;
  g.beginPath();
  g.moveTo(rcx, rcy);
  g.arc(rcx, rcy, rr, ang - 0.65, ang);
  g.closePath();
  g.fill();

  const bx = rcx + Math.cos(1.1) * rr * 0.68;
  const by = rcy + Math.sin(1.1) * rr * 0.68;
  g.fillStyle = MIL.sandBright;
  g.beginPath();
  g.arc(bx, by, 5.5, 0, Math.PI * 2);
  g.fill();

  g.fillStyle = MIL.phosphor;
  g.font = '800 16px JetMono';
  g.textAlign = 'center';
  g.fillText('100 МГц – 13 ГГц', rcx, sy + 26);

  g.font = '800 15px JetMono';
  g.fillText('ПЕЛЕНГ 360° · OK', rcx, sy + sh - 18);
  g.restore();
}

// Precision Tactical Corner Lock Brackets framing the entire 238x54 stamp box with ZERO text occlusion!
function drawTacticalSightReticle(g, x, y, lockFlash) {
  const expand = 1 + (1 - lockFlash) * 0.06;
  const hw = 126 * expand;
  const hh = 34 * expand;
  g.save();
  g.translate(x, y);

  if (lockFlash > 0.05) {
    g.strokeStyle = `rgba(231, 196, 117, ${(0.9 * (1 - lockFlash * 0.45)).toFixed(3)})`;
    g.lineWidth = 3.2;
    g.strokeRect(-hw - lockFlash * 10, -hh - lockFlash * 8, (hw + lockFlash * 10) * 2, (hh + lockFlash * 8) * 2);
  }

  g.strokeStyle = MIL.sandBright;
  g.lineWidth = 3.2;
  const L = 16;
  g.beginPath();
  g.moveTo(-hw, -hh + L); g.lineTo(-hw, -hh); g.lineTo(-hw + L, -hh);
  g.moveTo(hw - L, -hh);  g.lineTo(hw, -hh);  g.lineTo(hw, -hh + L);
  g.moveTo(hw, hh - L);   g.lineTo(hw, hh);   g.lineTo(hw - L, hh);
  g.moveTo(-hw + L, hh);  g.lineTo(-hw, hh);  g.lineTo(-hw, hh - L);
  g.stroke();
  g.restore();
}

    g.beginPath();
    g.moveTo(cx - 20, cy + 1);
    g.lineTo(cx + 19, cy - 15);
    g.lineTo(cx + 11, cy + 18);
    g.lineTo(cx - 1, cy + 8);
    g.lineTo(cx - 9, cy + 14);
    g.lineTo(cx - 8, cy + 3);
    g.closePath();
    g.fill();
  } else if (kind === 'vk') {
    g.fillStyle = MIL.bone;
    g.font = '900 30px RussoOne';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('VK', cx, cy + 2);
  } else {
    const dots = [
      [-11, -10, 9, MIL.sandBright],
      [11, -11, 12, MIL.olive],
      [-12, 12, 13, MIL.phosphor],
      [12, 13, 8, MIL.bone],
    ];
    dots.forEach(([dx, dy, r, col]) => {
      g.fillStyle = col;
      g.beginPath();
      g.arc(cx + dx, cy + dy, r, 0, Math.PI * 2);
      g.fill();
    });
  }
  g.restore();
}

function renderScene5(g, t) {
  const sStart = SYNC.cuts[4];
  const localT = t - sStart;

  const slamRecoil = Math.exp(-localT * 10.0) * 22;
  drawCoverImage(g, IMGS.bgArmor, 1.08 + Math.sin(localT * 0.65) * 0.012, Math.sin(localT * 0.4) * 14, slamRecoil, 0.52);

  const darkScrim = g.createRadialGradient(W / 2, H * 0.36, 90, W / 2, H * 0.5, 1180);
  darkScrim.addColorStop(0, 'rgba(17, 23, 13, 0.80)');
  darkScrim.addColorStop(1, 'rgba(9, 12, 7, 0.96)');
  g.fillStyle = darkScrim;
  g.fillRect(0, 0, W, H);

  const cam = makeCamera3D([Math.sin(localT * 0.35) * 0.7, 0.65, 7.1], [0, 0.1, 0], 46, 0);
  draw3DTacticalField(g, cam, {
    gridOpacity: 0.18,
    showDome: true,
    domePos: [0, 0.35, 0],
    domeRadius: 3.15,
    domeRot: t * 0.26,
    domeColor: 'rgba(213, 174, 92, 0.22)',
    dustRot: t * 0.08,
    dustAlpha: 0.52,
  });

  if (localT < 0.50) {
    const fp = localT / 0.50;
    g.save();
    g.strokeStyle = `rgba(213, 174, 92, ${(0.78 * (1 - fp)).toFixed(3)})`;
    g.lineWidth = 7 * (1 - fp) + 1;
    g.beginPath();
    g.arc(W / 2, 395, 85 + fp * 560, 0, Math.PI * 2);
    g.stroke();
    g.restore();
  }

  // HERO ORIGINAL BRAND LOGO ("GOYDA" Helmet Shield + "В ОКОПЕ" + "магазин брони") AT FULL MONUMENTAL SCALE!
  const bp = easeOutBack(clamp(0.58 + localT / 0.38, 0, 1), 1.15);
  g.save();
  g.translate(W / 2, 398 + (1 - bp) * 28);
  g.scale(bp, bp);
  // Warm subtle brass glow behind hero logo
  const glow = g.createRadialGradient(0, -20, 20, 0, -20, 290);
  glow.addColorStop(0, 'rgba(213, 174, 92, 0.25)');
  glow.addColorStop(1, 'rgba(213, 174, 92, 0)');
  g.fillStyle = glow;
  g.fillRect(-320, -300, 640, 560);
  // Drop shadow for crisp separation of GOYDA stencil & lettering
  g.shadowColor = 'rgba(0, 0, 0, 0.85)';
  g.shadowBlur = 22;
  g.shadowOffsetY = 8;
  drawLogoAspect(g, IMGS.logoFullLight, 0, 0, 392, 1.0);
  g.restore();

  // Subtitle range ribbon right under original logo
  g.save();
  g.globalAlpha = easeOutExpo(clamp(0.35 + localT / 0.45, 0, 1));
  g.textAlign = 'center';
  setFittedFont(g, 'РЭБ · ДЕТЕКТОРЫ · ЗАКРЫТАЯ СВЯЗЬ · БРОНЕЗАЩИТА', SAFE_W - 20, 24, 18, 'JetMono', '800');
  g.fillStyle = MIL.sand;
  g.fillText('РЭБ · ДЕТЕКТОРЫ · ЗАКРЫТАЯ СВЯЗЬ · БРОНЕЗАЩИТА', W / 2, 642);
  g.restore();

  // Sequential active spotlight wave across the 3 official military channel plates
  const spotlightPos = (localT * 0.85) % 3.0;
  const channels = [
    {
      kind: 'tg',
      name: 'ОФИЦИАЛЬНЫЙ TELEGRAM-КАНАЛ',
      url: 't.me/vokope_ru',
      note: 'Наличие на складе, новинки и заказ',
      accent: MIL.sand,
      delay: 0.08,
    },
    {
      kind: 'vk',
      name: 'СООБЩЕСТВО ВКОНТАКТЕ',
      url: 'vk.com/vokope_rus',
      note: 'Полевые обзоры, тесты и прямая связь',
      accent: MIL.olive,
      delay: 0.22,
    },
    {
      kind: 'avito',
      name: 'МАГАЗИН НА АВИТО',
      url: 'Авито — «В ОКОПЕ»',
      note: 'Проверенный продавец, отзывы и доставка по РФ',
      accent: MIL.phosphor,
      delay: 0.36,
    },
  ];

  channels.forEach((ch, idx) => {
    const cp = easeOutBack(clamp((localT - ch.delay + 0.12) / 0.44, 0, 1), 1.06);
    if (cp <= 0.01) return;
    const cy = 674 + idx * 198 + (1 - cp) * 30;
    const dist = Math.min(Math.abs(spotlightPos - idx), 3 - Math.abs(spotlightPos - idx));
    const focusBoost = clamp(1 - dist * 1.15, 0, 1) * smoothstep(0.8, 1.4, localT);

    g.save();
    g.globalAlpha = clamp(cp, 0, 1);

    drawArmorPlate(g, SAFE_PAD, cy, SAFE_W, 178, {
      cut: 20,
      fill: focusBoost > 0.35 ? 'rgba(31, 41, 22, 0.96)' : 'rgba(16, 21, 13, 0.95)',
      stroke: ch.accent,
      lineW: 2.0 + focusBoost * 1.8,
      rivets: true,
      accentBarLeft: ch.accent,
    });

    drawMilitaryChannelBadge(g, ch.kind, SAFE_PAD + 74, cy + 89);

    g.textAlign = 'left';
    setFittedFont(g, ch.name, SAFE_W - 180, 21, 16, 'JetMono', '800');
    g.fillStyle = ch.accent;
    g.fillText(ch.name, SAFE_PAD + 140, cy + 50);

    setFittedFont(g, ch.url, SAFE_W - 180, 43, 28, 'RussoOne', '900');
    g.fillStyle = MIL.bone;
    g.fillText(ch.url, SAFE_PAD + 140, cy + 106);

    setFittedFont(g, ch.note, SAFE_W - 180, 23, 18, 'RobotoBold', '700');
    g.fillStyle = MIL.ash;
    g.fillText(ch.note, SAFE_PAD + 140, cy + 148);
    g.restore();
  });

  // Heavy Brass-Sand Military Stencil Action Plate + Traveling Sheen
  const fp = easeOutExpo(clamp((localT - 0.42) / 0.48, 0, 1));
  if (fp > 0.01) {
    const stingGlow = Math.exp(-Math.pow((t - SYNC.s5Sting) / 0.36, 2));
    const ry = 1288 + (1 - fp) * 24;
    g.save();
    g.globalAlpha = fp;
    const btnGrad = g.createLinearGradient(SAFE_PAD, ry, SAFE_PAD + SAFE_W, ry);
    btnGrad.addColorStop(0, '#dfc072');
    btnGrad.addColorStop(1, '#be9342');
    drawArmorPlate(g, SAFE_PAD, ry, SAFE_W, 144, {
      cut: 20,
      fill: btnGrad,
      stroke: '#f7e6bd',
      lineW: 2.2,
      rivets: true,
    });

    g.save();
    armorPlatePath(g, SAFE_PAD, ry, SAFE_W, 144, 20);
    g.clip();
    const sheenX = SAFE_PAD - 240 + ((localT * 0.55) % 1.0) * (SAFE_W + 480);
    const sheenGrad = g.createLinearGradient(sheenX - 130, ry, sheenX + 130, ry + 80);
    sheenGrad.addColorStop(0, 'rgba(255,255,255,0)');
    sheenGrad.addColorStop(0.5, 'rgba(255,255,255,0.36)');
    sheenGrad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sheenGrad;
    g.fillRect(SAFE_PAD, ry, SAFE_W, 144);
    g.restore();

    if (stingGlow > 0.02) {
      armorPlatePath(g, SAFE_PAD, ry, SAFE_W, 144, 20);
      g.strokeStyle = `rgba(255,255,255,${(0.9 * stingGlow).toFixed(3)})`;
      g.lineWidth = 5;
      g.stroke();
    }

    g.textAlign = 'center';
    setFittedFont(g, 'ПЕРЕХОДИТЕ И ПИШИТЕ НАМ!', SAFE_W - 56, 38, 26, 'RussoOne', '900');
    g.fillStyle = '#0c1009';
    g.fillText('ПЕРЕХОДИТЕ И ПИШИТЕ НАМ!', W / 2, ry + 62);

    setFittedFont(g, 'ПОДБЕРЁМ ПОД ЗАДАЧУ · ОПТ И РОЗНИЦА · С НДС И БЕЗ', SAFE_W - 56, 21, 16, 'JetMono', '800');
    g.fillStyle = '#1b2314';
    g.fillText('ПОДБЕРЁМ ПОД ЗАДАЧУ · ОПТ И РОЗНИЦА · С НДС И БЕЗ', W / 2, ry + 108);
    g.restore();
  }

  // Bottom 3-Unit Tactical Arsenal Showcase Rack
  const sp = easeOutExpo(clamp((localT - 0.52) / 0.50, 0, 1));
  if (sp > 0.01) {
    const sy = 1462 + (1 - sp) * 26;
    g.save();
    g.globalAlpha = sp;
    drawArmorPlate(g, SAFE_PAD, sy, SAFE_W, 314, {
      cut: 22,
      fill: 'rgba(15, 20, 12, 0.93)',
      stroke: MIL.borderSand,
      lineW: 1.8,
      rivets: true,
    });

    const miniItems = [
      { img: IMGS.rebDome, blur: BLUR_IMGS.rebDome, label: 'РЭБ РОМАШКА / КАПЮШОН', h: 205 },
      { img: IMGS.detector, blur: BLUR_IMGS.detector, label: 'БУЛАТ V4 / СИГНАЛ', h: 205 },
      { img: IMGS.radio, blur: BLUR_IMGS.radio, label: 'ВОЕВОДА / БР5 / СВЯЗЬ', h: 205 },
    ];
    const colW = SAFE_W / 3;
    miniItems.forEach((m, i) => {
      const mx = SAFE_PAD + colW * (i + 0.5);
      const bob = Math.sin(t * 2.2 + i * 1.4) * 4;
      drawCutout(g, m.img, m.blur, mx, sy + 132 + bob, m.h, {
        alpha: 0.98,
        glowColor: i === 0 ? 'rgba(213,174,92,ALPHA)' : i === 1 ? 'rgba(143,209,88,ALPHA)' : 'rgba(132,158,84,ALPHA)',
        glowAlpha: 0.36,
        shadowAlpha: 0.65,
      });
      setFittedFont(g, m.label, colW - 24, 18, 14, 'JetMono', '800');
      g.fillStyle = MIL.sand;
      g.textAlign = 'center';
      g.fillText(m.label, mx, sy + 276);
    });
    g.restore();
  }
}

function resetCanvasState(targetCtx) {
  targetCtx.globalAlpha = 1;
  targetCtx.globalCompositeOperation = 'source-over';
  targetCtx.shadowBlur = 0;
  targetCtx.shadowOffsetX = 0;
  targetCtx.shadowOffsetY = 0;
  targetCtx.lineWidth = 1;
  targetCtx.textBaseline = 'alphabetic';
  targetCtx.textAlign = 'left';
  targetCtx.fillStyle = MIL.bgDark;
  targetCtx.fillRect(0, 0, W, H);

  uctx.globalAlpha = 1;
  uctx.globalCompositeOperation = 'source-over';
  uctx.shadowBlur = 0;
  uctx.lineWidth = 1;
  uctx.textBaseline = 'alphabetic';
  uctx.textAlign = 'left';
}

function renderWorldOnly(targetCtx, tc) {
  resetCanvasState(targetCtx);
  const sIdx = getSceneIndex(tc);
  if (sIdx === 0) renderScene1(targetCtx, tc);
  else if (sIdx === 1) renderScene2(targetCtx, tc);
  else if (sIdx === 2) renderScene3(targetCtx, tc);
  else if (sIdx === 3) renderScene4(targetCtx, tc);
  else renderScene5(targetCtx, tc);

  // Warm tungsten optical flare across scene cuts
  for (let i = 1; i <= 4; i++) {
    const dt = tc - SYNC.cuts[i];
    if (Math.abs(dt) < 0.09) {
      const k = 1 - Math.abs(dt) / 0.09;
      const wipeX = lerp(-W * 0.3, W * 1.3, invLerp(-0.09, 0.09, dt));
      targetCtx.save();
      const lg = targetCtx.createLinearGradient(wipeX - 240, 0, wipeX + 240, 0);
      lg.addColorStop(0, 'rgba(213,174,92,0)');
      lg.addColorStop(0.5, `rgba(232,192,104,${(0.36 * k).toFixed(3)})`);
      lg.addColorStop(1, 'rgba(132,158,84,0)');
      targetCtx.fillStyle = lg;
      targetCtx.fillRect(0, 0, W, H);
      targetCtx.restore();
    }
  }
}

function motionVelocityFactor(t) {
  for (let i = 1; i <= 4; i++) {
    if (Math.abs(t - SYNC.cuts[i]) < 0.14) return 1.0;
  }
  if (t >= 0.12 && t <= 0.55) return 0.65;
  if (Math.abs(t - SYNC.s2Nodes[1]) < 0.32) return 0.85;
  if (Math.abs(t - SYNC.s2Nodes[2]) < 0.32) return 0.85;
  if (t >= 19.70 && t <= 20.35) return 0.65;
  return 0.0;
}

window.renderAt = function renderAt(t) {
  const tc = clamp(t, 0, DURATION);
  const sIdx = getSceneIndex(tc);
  const sLo = SYNC.cuts[sIdx];
  const sHi = SYNC.cuts[sIdx + 1] - 1e-4;
  const vel = motionVelocityFactor(tc);

  if (vel <= 0.01) {
    renderWorldOnly(mctx, tc);
  } else {
    const samples = 3;
    const shutter = (1 / 90) * vel;
    mctx.fillStyle = MIL.bgDark;
    mctx.fillRect(0, 0, W, H);
    for (let s = 0; s < samples; s++) {
      const subT = clamp(tc - shutter * 0.5 + (shutter * s) / (samples - 1), sLo, sHi);
      renderWorldOnly(ctx, subT);
      mctx.save();
      mctx.globalAlpha = 1 / (s + 1);
      mctx.drawImage(frameCanvas, 0, 0);
      mctx.restore();
    }
  }

  drawScreenSpaceHUD(mctx, tc, sIdx);
};

window.getFrameSignature = function getFrameSignature() {
  const data = mctx.getImageData(0, 0, W, H).data;
  let h1 = 0x811c9dc5;
  for (let i = 0; i < data.length; i += 64) {
    h1 ^= data[i];
    h1 = Math.imul(h1, 0x01000193) >>> 0;
  }
  return h1.toString(16).padStart(8, '0');
};

window.__READY_PROMISE = (async () => {
  const fontSpecs = [
    '900 48px RussoOne',
    '400 32px RubikDirt',
    '800 28px Tektur',
    '900 40px FiraCond',
    '800 24px JetMono',
    '700 24px RobotoBold',
  ];
  await Promise.all(fontSpecs.map((spec) => document.fonts.load(spec, 'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюяABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789✓[]·/-')));
  await document.fonts.ready;

  await Promise.all(
    Object.entries(ASSET_PATHS).map(
      ([key, url]) =>
        new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            IMGS[key] = img;
            BLUR_IMGS[key] = createBlurredCopy(img, 14);
            resolve();
          };
          img.onerror = (e) => reject(new Error(`Failed to load ${url}: ${e}`));
          img.src = url;
        })
    )
  );

  for (const wt of [0.05, 0.5, 6.0, 10.0, 13.0, 16.25, 21.0, 26.0, 29.5]) {
    window.renderAt(wt);
  }
  await document.fonts.ready;
  window.renderAt(0);
  window.__SCENE_READY = true;
  return true;
})();
