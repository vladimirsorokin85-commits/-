<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ecd7">
  <title>В своём ритме — мультфильм о детекторе дронов</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="masthead">
    <span class="wordmark"><span class="stamp" aria-hidden="true"></span>МАГАЗИН «В ОКОПЕ»</span>
    <span class="edition">КИНОЗАЛ <span aria-hidden="true">/</span> 04</span>
  </header>
  <main class="layout">
    <section class="intro" aria-labelledby="title">
      <p class="kicker">МУЛЬТФИЛЬМ <span aria-hidden="true">/</span> <span id="running-time">00:30</span></p>
      <h1 id="title">В своём <span>ритме.</span></h1>
      <p class="lead">Дрон на подлёте, короткий звуковой сигнал и цех в ритме музыки. А у заводского кота — свой график.</p>
      <div class="actions">
        <button type="button" id="watch" class="action action-primary">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6z" fill="currentColor"/></svg>
          <span id="watch-label">Смотреть</span>
        </button>
        <a class="action action-download" id="download" href="./film.mp4" download="v_okope_v_svoem_ritme_montazh.mp4">
          <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10m-4-4 4 4 4-4M4 15v2h12v-2"/></svg>
          Скачать MP4
        </a>
      </div>
      <nav id="contacts" class="contact-links" aria-label="Магазин «В Окопе» в социальных сетях"></nav>
      <a class="series-link" href="./game-over/">Следующий ролик: Game Over для дрона&nbsp;→</a>
      <p id="status" class="status" role="status" hidden></p>
    </section>
    <figure class="screen" id="screen">
      <video id="film" controls playsinline preload="metadata" poster="./output/v-svoem-ritme-montazh.jpg" aria-label="Мультфильм «В своём ритме»">
        <source src="./film.mp4" type="video/mp4">
        Ваш браузер не поддерживает встроенный плеер. Воспользуйтесь кнопкой «Скачать MP4».
      </video>
      <figcaption>
        <span>1080 × 1920 <span class="dot" aria-hidden="true">·</span> 9:16</span>
        <span id="frame-rate">30 кадров/с</span>
      </figcaption>
    </figure>
    <nav class="chapters" aria-label="Сцены мультфильма">
      <div class="chapters-heading"><h2>Сцены</h2><span id="count" class="count">05</span></div>
      <ol id="chapters"></ol>
    </nav>
    <details class="transcript">
      <summary>Читать текст озвучки</summary>
      <div id="transcript"></div>
    </details>
  </main>
  <script type="module" src="./player.mjs"></script>
</body>
</html>
