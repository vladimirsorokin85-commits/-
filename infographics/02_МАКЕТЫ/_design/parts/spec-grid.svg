<svg xmlns="http://www.w3.org/2000/svg" class="sx sx-specgrid" viewBox="0 0 952 548" width="952" height="548" role="img" aria-labelledby="sx-specgrid-title">
  <title id="sx-specgrid-title">Подложка технической таблицы: шапка и семь строк, семь колонок</title>
  <style>
    .sx {
      --sx-line: var(--line, rgba(29, 30, 26, 0.16));
      --sx-line2: var(--line-strong, rgba(29, 30, 26, 0.38));
      --sx-accent: var(--accent, #C8451F);
    }
    .sx .sx-ln { fill: none; stroke: var(--sx-line); stroke-width: 1; }
    .sx .sx-ln2 { fill: none; stroke: var(--sx-line2); stroke-width: 1.4; }
    .sx .sx-acc { fill: var(--sx-accent); }
  </style>

  <!-- вертикали: 150 / 160 / 215 / 110 / 105 / 130 / 82 = 952 -->
  <g class="sx-ln">
    <line x1="150" y1="0" x2="150" y2="548"/>
    <line x1="310" y1="0" x2="310" y2="548"/>
    <line x1="525" y1="0" x2="525" y2="548"/>
    <line x1="635" y1="0" x2="635" y2="548"/>
    <line x1="740" y1="0" x2="740" y2="548"/>
    <line x1="870" y1="0" x2="870" y2="548"/>
  </g>

  <!-- горизонтали: шапка 44 + 7 строк по 72 -->
  <g class="sx-ln">
    <line x1="0" y1="116" x2="952" y2="116"/>
    <line x1="0" y1="188" x2="952" y2="188"/>
    <line x1="0" y1="260" x2="952" y2="260"/>
    <line x1="0" y1="332" x2="952" y2="332"/>
    <line x1="0" y1="404" x2="952" y2="404"/>
    <line x1="0" y1="476" x2="952" y2="476"/>
  </g>

  <!-- контур таблицы -->
  <line class="sx-ln2" x1="0" y1="0" x2="952" y2="0"/>
  <line class="sx-ln2" x1="0" y1="44" x2="952" y2="44"/>
  <line class="sx-ln2" x1="0" y1="548" x2="952" y2="548"/>

  <!-- акцентная метка начала таблицы -->
  <rect class="sx-acc" x="0" y="0" width="28" height="2"/>
</svg>
