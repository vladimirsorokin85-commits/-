<svg xmlns="http://www.w3.org/2000/svg" class="sx sx-funnel" viewBox="0 0 540 640" width="540" height="640" role="img" aria-labelledby="sx-funnel-title">
  <title id="sx-funnel-title">Шесть шагов покупки: заявка, разбор задачи, подбор и КП, договор и документы, поставка, ввод и сервис</title>
  <style>
    .sx {
      --sx-ink: var(--fg, #1D1E1A);
      --sx-dim: var(--fg-dim, rgba(29, 30, 26, 0.66));
      --sx-faint: var(--fg-faint, rgba(29, 30, 26, 0.40));
      --sx-line: var(--line, rgba(29, 30, 26, 0.18));
      --sx-line2: var(--line-strong, rgba(29, 30, 26, 0.38));
      --sx-accent: var(--accent, #C8451F);
      --sx-acc-ink: var(--accent-ink, #F4F1EA);
      --sx-paper: var(--bg, #F4F1EA);
    }
    .sx .sx-ln2 { fill: none; stroke: var(--sx-line2); stroke-width: 1.2; }
    .sx .sx-kick { font-family: "Oswald", "Segoe UI", sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.13em; fill: var(--sx-dim); }
    .sx .sx-num { font-family: "Tektur", "Consolas", "Segoe UI", monospace; font-size: 13px; fill: var(--sx-ink); }
    .sx .sx-num-acc { font-family: "Tektur", "Consolas", "Segoe UI", monospace; font-size: 13px; fill: var(--sx-acc-ink); }
    .sx .sx-title { font-family: "Oswald", "Sofia Sans Cond", "Segoe UI", sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 0.05em; fill: var(--sx-ink); }
    .sx .sx-sub { font-family: "Segoe UI", "Inter", Arial, sans-serif; font-size: 13px; fill: var(--sx-dim); }
    .sx .sx-note { font-family: "Segoe UI", "Inter", Arial, sans-serif; font-size: 13px; fill: var(--sx-faint); }
    .sx .sx-node { fill: var(--sx-paper); stroke: var(--sx-line2); stroke-width: 1.2; }
    .sx .sx-node-acc { fill: var(--sx-accent); }
    .sx .a-mid { text-anchor: middle; }
  </style>

  <text class="sx-kick" x="0" y="22">ШЕСТЬ ШАГОВ — ОТ ЗАЯВКИ ДО СЕРВИСА</text>

  <!-- соединительная линия -->
  <line class="sx-ln2" x1="26" y1="58" x2="26" y2="542"/>

  <!-- 01 ЗАЯВКА -->
  <rect class="sx-node" x="9" y="47" width="34" height="34"/>
  <text class="sx-num a-mid" x="26" y="69">01</text>
  <text class="sx-title" x="68" y="63">ЗАЯВКА</text>
  <text class="sx-sub" x="68" y="83">Telegram, телефон или сайт — 5 вводных для КП</text>

  <!-- 02 РАЗБОР ЗАДАЧИ -->
  <rect class="sx-node" x="9" y="139" width="34" height="34"/>
  <text class="sx-num a-mid" x="26" y="161">02</text>
  <text class="sx-title" x="68" y="155">РАЗБОР ЗАДАЧИ</text>
  <text class="sx-sub" x="68" y="175">объект, площадь, задачи, питание, сроки</text>

  <!-- 03 ПОДБОР И КП -->
  <rect class="sx-node" x="9" y="231" width="34" height="34"/>
  <text class="sx-num a-mid" x="26" y="253">03</text>
  <text class="sx-title" x="68" y="247">ПОДБОР И КП</text>
  <text class="sx-sub" x="68" y="267">конфигурация, документы, сроки, стоимость</text>

  <!-- 04 ДОГОВОР И ДОКУМЕНТЫ -->
  <rect class="sx-node" x="9" y="323" width="34" height="34"/>
  <text class="sx-num a-mid" x="26" y="345">04</text>
  <text class="sx-title" x="68" y="339">ДОГОВОР И ДОКУМЕНТЫ</text>
  <text class="sx-sub" x="68" y="359">комплектация, гарантия, правовой чек-лист</text>

  <!-- 05 ПОСТАВКА -->
  <rect class="sx-node" x="9" y="415" width="34" height="34"/>
  <text class="sx-num a-mid" x="26" y="437">05</text>
  <text class="sx-title" x="68" y="431">ПОСТАВКА</text>
  <text class="sx-sub" x="68" y="451">склад, доставка по РФ, самовывоз в Москве</text>

  <!-- 06 ВВОД И СЕРВИС -->
  <rect class="sx-node-acc" x="9" y="507" width="34" height="34"/>
  <text class="sx-num-acc a-mid" x="26" y="529">06</text>
  <text class="sx-title" x="68" y="523">ВВОД И СЕРВИС</text>
  <text class="sx-sub" x="68" y="543">монтаж, проверка Т-9, обучение, 12 месяцев</text>

  <line class="sx-ln2" x1="0" y1="578" x2="540" y2="578"/>
  <text class="sx-note" x="0" y="602">Гарантия 12 месяцев · сервис производителя · обучение по договору</text>
</svg>
